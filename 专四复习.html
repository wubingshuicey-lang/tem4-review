{q:"I regret ______ you that your application has been rejected.",o:["telling","to tell","tell","told"],a:1,e:"regret to do = 遗憾地要做某事（告知坏消息）；regret doing = 后悔做过某事。"},
{q:"______ from space, the earth looks like a blue marble.",o:["Seeing","To see","Seen","Having seen"],a:2,e:"主语 the earth 是「被看」的对象，用过去分词 Seen 作状语表被动。"},
{q:"He narrowly avoided ______ by the falling tree.",o:["being hit","hitting","to be hit","having hit"],a:0,e:"avoid + doing；主语 he 被树砸到→被动 being done。"},
{q:"______ the final exam, he felt extremely relieved.",o:["Finished","Having finished","To finish","Being finished"],a:1,e:"完成考试发生在 felt relieved 之前，用 Having finished 表示主动+先时性。"},
{q:"The manager promised ______ the issue at the next meeting.",o:["discussing","to discuss","discuss","having discussed"],a:1,e:"promise 后接不定式 to do。"}
],pastExam:[{y:2018,q:"She hired a lawyer to investigate, only to learn that Gabriel had removed her name from the deed. The infinitive verb phrase 'only to learn' is used __________.",o:["to express an intended purpose","to indicate a high degree of possibility","to reveal an undesirable consequence","to dramatize a stated fact"],a:2,e:"only to learn 结构表示一个出乎意料/不如意的结果（undesirable consequence）。"},{y:2019,q:"A group ______ casinos has urged officials...",o:["opposed to","opposing to","objected to","protested against"],a:0,e:"opposed to casinos 作后置定语（= that is opposed to...）。B/D应用主动语态。"},{y:2017,q:"Some Martian rock structures look... like structures on Earth that are known ______ by microbes.",o:["to create","having been created","to have been created","being created"],a:2,e:"be known to have done 结构。微生物造成岩石结构→完成体不定式。"},{y:2023,q:"______ by the beautiful scenery, the tourists stopped to take photos.",o:["Attracting","Attracted","To attract","Having attracted"],a:1,e:"tourists被景色吸引→过去分词Attracted作状语。2023真题。"},
{y:2022,q:"The problem is worth ______ at the next meeting.",o:["discussing","to discuss","discuss","being discussed"],a:0,e:"be worth + doing (主动形式表被动含义)。= be worthy of being discussed / to be discussed。"},
{y:2021,q:"______ enough time, I would have done it better.",o:["Giving","To give","Given","Having given"],a:2,e:"I 被给予时间→过去分词Given作状语(= If I had been given...)。"},
{y:2020,q:"The manager has decided ______ the production plan.",o:["changing","to change","change","changed"],a:1,e:"decide + to do。常见接不定式的动词之一。"},
{y:2019,q:"I remember ______ to the party, but I am not sure if I actually went.",o:["inviting","to invite","being invited","having invited"],a:2,e:"remember+doing记得做过。我被邀请→被动being done。went提示是过去的事。"},
{y:2018,q:"With all the problems ______, the director felt a sense of relief.",o:["solved","solving","to solve","to have solved"],a:0,e:"with复合结构：problems被解决→过去分词solved作宾补。all the problems与solve是被动关系。"},
{y:2017,q:"People tend ______ more when they are under stress.",o:["eating","to eat","eaten","eat"],a:1,e:"tend + to do 倾向于做某事。固定搭配。"},
{y:2016,q:"The ______ child was finally found in the park.",o:["losing","lost","having lost","being lost"],a:1,e:"lost作定语修饰child，表示'走失的'。单个过去分词作前置定语。"},
{y:2015,q:"He spent the whole afternoon ______ for the exam.",o:["prepare","preparing","to prepare","prepared"],a:1,e:"spend time + (in) doing。固定用法。"},
{y:2014,q:"______ a satisfactory solution, the committee decided to put off the meeting.",o:["Not having reached","Not reaching","Not reached","Not to reach"],a:0,e:"先'未达成'后'推迟'→先时性用having done。否定式Not要放在前面。"}]},
{id:'inversion',title:'倒装与强调',desc:'完全倒装、部分倒装及强调句型',content:`<h3>倒装与强调</h3><h4>一、完全倒装</h4><p>方位副词(here,there,out,in,up,down,away)置句首，主语非人称代词时完全倒装。</p><div class="ex-box"><div class="en">Here <strong>comes</strong> the bus. / Out <strong>rushed</strong> the children.</div></div><div class="warn"><span class="wi">⚠</span><div>人称代词主语不倒装：Here <strong>he</strong> comes. ✓</div></div><h4>二、部分倒装（必考！）</h4><table><tr><th>触发词/结构</th><th>例句</th></tr><tr><td>否定词/短语置句首never,seldom,rarely,hardly,little,by no means,under no circumstances,at no time</td><td><strong>Never have</strong> I seen such beauty.<br><strong>Under no circumstances should</strong> you open that door.</td></tr><tr><td>Not only...but also...</td><td><strong>Not only did</strong> he finish, but he also helped.</td></tr><tr><td>Hardly...when.../No sooner...than.../Scarcely...when...</td><td><strong>Hardly had</strong> I sat down <strong>when</strong> the phone rang.</td></tr><tr><td>So...that.../Such...that...</td><td><strong>So fast does</strong> light travel that...</td></tr><tr><td>Only+状语置句首</td><td><strong>Only in this way can</strong> we solve it.</td></tr><tr><td>Not until...</td><td><strong>Not until</strong> yesterday <strong>did</strong> I know it.</td></tr><tr><td>as/though引导让步状语从句</td><td>Child <strong>as</strong> he is, he knows a lot.</td></tr></table><div class="warn"><span class="wi">⚠</span><div>only+主语时不倒装：Only he knows the answer.</div></div><h4>三、强调句型</h4><p><strong>1. It is/was+被强调部分+that/who+其余</strong><br><strong>2. do/does/did+动词原形</strong>强调谓语<br>判断法：去掉It is/was...that...后句子仍完整→强调句</p>`,practice:[{q:"Not until the meeting was over ______ that he had made a mistake.",o:["did he realize","he realized","had he realized","he had realized"],a:0,e:"Not until置句首→主句部分倒装。"},{q:"Child ______ he is, he knows a lot about programming.",o:["as","though","although","despite"],a:0,e:"名词+as+主语+be表让步。注意名词前不用冠词。"},{q:"It was in the library ______ I met Professor Zhang.",o:["where","that","which","when"],a:1,e:"强调句型用that。非定语从句（不用where）。"},{q:"Hardly ______ the airport when the plane took off.",o:["I had reached","did I reach","had I reached","I reached"],a:2,e:"Hardly...when→过去完成时倒装。"},{q:"Only by working together ______ achieve the goal.",o:["we can","can we","we will","do we"],a:1,e:"Only+方式状语置句首→部分倒装。"}],pastExam:[{y:2022,q:"Here are sixty-five stories. Among them, _______ you find at least a few...",o:["will","would","are","do"],a:0,e:"Among them 置句首→倒装 Among them will you find = you will find among them。"},{y:2023,q:"Not only ______ a promise, but he also kept it.",o:["did he make","he made","had he made","he had made"],a:0,e:"Not only...but also...句首→前半部分倒装 did he make。"},{y:2022,q:"Under no circumstances ______ the rules of the laboratory.",o:["should you break","you should break","you broke","do you break"],a:0,e:"Under no circumstances(否定短语)→倒装 should you break。"},{y:2021,q:"______ the importance of environmental protection that the government has taken actions.",o:["So great is","Such great is","So great was","Such is"],a:0,e:"So+adj.置句首→倒装。So great is the importance...that..."},{y:2020,q:"It was not until she had finished all her work ______ home.",o:["that she went","when she went","did she go","then she went"],a:0,e:"强调句型 It was not until...that...，不倒装。"},{y:2019,q:"Only when the war was over ______ to his hometown.",o:["did he return","he returned","had he returned","he had returned"],a:0,e:"Only+状语从句置句首→主句倒装 did he return。"},{y:2018,q:"______ got on the train when it began to move.",o:["No sooner had I","No sooner I had","Hardly I had","Scarcely I had"],a:0,e:"No sooner...than倒装句：No sooner had I + done...than..."},{y:2017,q:"It is not intelligence but hard work ______ matters.",o:["that","which","what","who"],a:0,e:"强调句型 It is...that...。被强调部分含not...but...结构。"},{y:2016,q:"______ you were here, I would have called you immediately.",o:["Had I known","If I know","I had known","Did I know"],a:0,e:"与过去相反虚拟条件省略if→倒装：Had I known = If I had known。"},{y:2015,q:"Little ______ that he was seriously ill.",o:["did we know","we knew","we did know","knew we"],a:0,e:"Little否定词置句首→倒装 did we know。"},{y:2014,q:"It was in 2010 ______ he graduated from university.",o:["that","when","which","in which"],a:0,e:"强调句型It was...that...，非定语从句。"}]},{id:'clauses',title:'三大从句',desc:'名词性从句、定语从句、状语从句详解',content:`<h3>三大从句</h3><h4>一、名词性从句</h4><p>包括主语从句、宾语从句、表语从句、同位语从句。引导词：that, whether/if, wh-词。<br>主语/表语/同位语从句中that不可省略。<br>介词后只用whether不用if。</p><h4>二、定语从句（重点！）</h4><p><strong>只用that的情况：</strong>最高级/序数词/the only/the very修饰；all/everything/nothing等不定代词先行词；既有人又有物；who/which开头的疑问句。</p><p><strong>as vs which：</strong>as可放句首指代整个主句("正如")；which只能放句末。</p><p><strong>介词+which/whom：</strong>正式用法。介词的选择取决于从句动词搭配。</p><h4>三、状语从句</h4><table><tr><th>类型</th><th>常见连词</th></tr><tr><td>时间</td><td>when,while,as,before,after,until,since,as soon as</td></tr><tr><td>原因</td><td>because,since,as,now that</td></tr><tr><td>条件</td><td>if,unless,as long as,provided that</td></tr><tr><td>让步</td><td>although,though,even if,while,as</td></tr><tr><td>目的</td><td>so that,in order that</td></tr><tr><td>结果</td><td>so...that,such...that</td></tr></table>`,practice:[{q:"The reason ______ he was late was ______ his car broke down.",o:["why; that","that; why","why; because","that; that"],a:0,e:"reason后定语从句用why；表语从句用that（不用because）。"},{q:"This is the best film ______ I have ever seen.",o:["which","that","what","as"],a:1,e:"先行词有最高级the best修饰→只用that。"},{q:"______ is often the case, he arrived late again.",o:["Which","That","As","What"],a:2,e:"as引导非限制性定语从句，可置句首。which只能放句末。"},{q:"The news ______ our team won excited everyone.",o:["which","that","what","when"],a:1,e:"同位语从句(news=our team won)→用that。"}],pastExam:[{y:2019,q:"Protocol was ______ enabled him to make difficult decisions...",o:["which","that","what","when"],a:2,e:"What 引导表语从句，在从句中作主语，相当于 the thing that。"},{y:2019,q:"...he set up as an army coach. — where 引导的是______。",o:["限制性定语从句","状语从句","非限制性定语从句","名词性从句"],a:2,e:"where 引导非限制性定语从句，补充说明 Harry 在伦敦的后续动作。"},{y:2022,q:"Drama in fiction occurs... whether _______ a conflict...",o:["it must be","must be","will be","has been"],a:0,e:"whether 引导的让步状语从句。whether it must be = 不管是否必须。"},{y:2017,q:"She followed the receptionist... to a closed door, ______ the woman gave a quick knock...",o:["on which","at which","in which","to which"],a:0,e:"on which = on the door。介词+which 引导定语从句，knock on the door。"},{y:2023,q:"The professor, together with his students, ______ the laboratory now.",o:["are visiting","is visiting","visit","have visited"],a:1,e:"together with→就远原则，与professor一致→单数。"},{y:2022,q:"______ the meeting will be held is still under discussion.",o:["That","When","What","Which"],a:1,e:"主语从句缺少时间状语→When。"},{y:2021,q:"There are many students ______ want to join the club.",o:["who","which","whom","they"],a:0,e:"定语从句修饰students(人+主语)→who。"},{y:2020,q:"The fact ______ smoking is harmful to health is well known.",o:["which","what","that","for which"],a:2,e:"同位语从句→that。"},{y:2019,q:"I was about to leave ______ it started to rain.",o:["while","when","as","after"],a:1,e:"be about to...when...固定句型。"},{y:2018,q:"The reason for his absence is ______ he was ill.",o:["because","that","why","for"],a:1,e:"reason表语从句用that引导，不用because。"},{y:2017,q:"______ is known to all, the moon travels around the earth.",o:["As","Which","That","It"],a:0,e:"As引导非限制性定语从句，置句首。"},{y:2016,q:"She is the only one of the girls who ______ French.",o:["speak","speaks","has spoken","have spoken"],a:1,e:"the only one of+复数→定语从句修饰one→单数。"},{y:2015,q:"He didn't tell me the place ______ he would meet her.",o:["which","that","where","when"],a:2,e:"定语从句缺少地点状语→where(=at which)。"},{y:2014,q:"______ breaks the law will be punished.",o:["Whoever","Who","No matter who","Anyone"],a:0,e:"主语从句用Whoever(=Anyone who)。"}]},{id:'agreement',title:'主谓一致',desc:'语法一致、意义一致、就近原则',content:`<h3>主谓一致</h3><table><tr><th>主语类型</th><th>谓语</th><th>例句</th></tr><tr><td>each/every+单名</td><td>单数</td><td>Each student has a book.</td></tr><tr><td>many a/more than one+单名</td><td>单数</td><td>Many a student likes it.</td></tr><tr><td>a number of+复名</td><td>复数</td><td>A number of students are here.</td></tr><tr><td>the number of+复名</td><td>单数</td><td>The number is 50.</td></tr><tr><td>the+adj.(一类人)</td><td>复数</td><td>The rich are not always happy.</td></tr><tr><td>together with/as well as</td><td>就远原则</td><td>Tom, with his friends, is going.</td></tr><tr><td>either...or/neither...nor</td><td>就近原则</td><td>Neither he nor I am wrong.</td></tr><tr><td>分数+of+名词</td><td>看名词</td><td>Two-thirds of water is / students are</td></tr><tr><td>集合名词(family/team/class)</td><td>看语境</td><td>整体→单数；个体→复数</td></tr></table>`,practice:[{q:"The number of students ______ increasing every year.",o:["are","is","were","have been"],a:1,e:"the number of+复名→单数谓语。"},{q:"Many a student ______ made the same mistake.",o:["have","has","are","were"],a:1,e:"many a+单名→单数谓语。"},{q:"Neither the teacher nor the students ______ satisfied.",o:["is","was","are","has been"],a:2,e:"neither...nor就近原则→students复数→are。"},{q:"The professor, as well as his assistants, ______ the experiment.",o:["conduct","conducts","are conducting","have conducted"],a:1,e:"as well as就远原则→professor单数→conducts。"}],pastExam:[{y:2018,q:"Indeed, it is arguable that body shattering is the very point of football, as killing and maiming ______________.",o:["war","are war","of war","are of war"],a:3,e:"as killing and maiming are of war = 正如杀戮和致残是战争的核心。are of + n. = are + adj.。复数主语→are。"},{y:2022,q:"The number of people invited ______ fifty, but a number of them ______ absent.",o:["were; was","was; were","was; was","were; were"],a:1,e:"the number单数was; a number of复数were。"},{y:2020,q:"Every man and every woman ______ the right to vote.",o:["have","has","are having","were having"],a:1,e:"every...and every...→单数谓语has。"},{y:2018,q:"Neither of the two answers ______ correct.",o:["are","is","were","have been"],a:1,e:"neither of+复名→单数谓语is。"},{y:2016,q:"The police ______ the case for three months.",o:["has investigated","have been investigating","is investigating","was investigating"],a:1,e:"police复数意义→have。for three months→完成进行。"}]},{id:'articles',title:'冠词',desc:'定冠词、不定冠词及零冠词',content:`<h3>冠词</h3><h4>不定冠词a/an</h4><p>第一次提及、泛指一类、抽象名词具体化(a pleasure)、固定搭配(have a cold)。<br>a vs an：看发音元音/辅音（an hour, a university）。</p><h4>定冠词the</h4><p>特指上文提及的；独一无二的(sun,moon)；序数词/最高级前；乐器前(play the piano)；the+adj.(一类人)；江河湖海山脉沙漠；普通名词构成的专有名词(the UN)。</p><h4>零冠词</h4><p>不可数/复数泛指；三餐/球类/学科；节日；称呼头衔(President)；by+交通(by bus)。</p><div class="warn"><span class="wi">⚠</span><div>有无冠词意义不同：in front of(外部前) vs in the front of(内部前)；go to school(上学) vs go to the school(去那所学校)。</div></div>`,practice:[{q:"He plays ______ piano but can't play ______ basketball.",o:["/; /","the; /","the; the","/; the"],a:1,e:"乐器前加the，球类前不加冠词。"},{q:"______ Yellow River is ______ second longest river in China.",o:["The; the","/; the","The; a","/; a"],a:0,e:"河流前加the；序数词前加the。"},{q:"We usually have ______ lunch at 12 o'clock.",o:["a","the","an","/"],a:3,e:"三餐前不加冠词。"}],pastExam:[{y:2018,q:"I long to alleviate __________, but I cannot.",o:["the evil","evil","evils","an evil"],a:0,e:"the evil 特指抽象的「恶、邪恶」，定冠词表示抽象类别。"},{y:2019,q:"...to do ______ he was hired never to do...",o:["that one thing","what one thing","such one thing","the one thing"],a:3,e:"破折号后明确说明具体内容，为确定特指，用 the one thing。"},{y:2023,q:"He was elected ______ chairman of the committee.",o:["a","the","an","/"],a:3,e:"头衔/职位前不加冠词。"},{y:2021,q:"What ______ pity that you can't come!",o:["a","the","/","an"],a:0,e:"What a pity!固定表达。"},{y:2019,q:"They are paid by ______ hour.",o:["a","the","an","/"],a:1,e:"by the hour按小时计。by the+单位名词。"},{y:2017,q:"______ more I know him, ______ more I respect him.",o:["The; the","/; /","A; a","The; /"],a:0,e:"the more...the more...固定句型。"}]},{id:'prepositions',title:'介词',desc:'易混介词辨析及常考固定搭配',content:`<h3>介词</h3><h4>易混介词</h4><table><tr><th>介词</th><th>区别</th></tr><tr><td>at/in/on(地点)</td><td>at点; in范围; on表面</td></tr><tr><td>at/in/on(时间)</td><td>at时刻; in时间段; on具体天</td></tr><tr><td>in/after(时间)</td><td>in+时间段(将来); after+时间段(过去)</td></tr><tr><td>between/among</td><td>between两者; among三者+</td></tr><tr><td>except/besides</td><td>except排除; besides包括</td></tr><tr><td>across/through</td><td>across表面; through空间穿过</td></tr></table><h4>高频搭配</h4><p>key/solution/approach/answer <strong>to</strong>; depend <strong>on</strong>; insist <strong>on</strong>; succeed <strong>in</strong>; belong <strong>to</strong>; prevent...<strong>from</strong>; be familiar <strong>with</strong>(某人对...熟悉)/<strong>to</strong>(...对某人熟悉); be absent <strong>from</strong>; congratulate <strong>on</strong></p>`,practice:[{q:"The key ______ success is hard work.",o:["of","for","to","in"],a:2,e:"key to... ...的关键。"},{q:"He will be back ______ two hours.",o:["after","in","within","for"],a:1,e:"将来时+in+时间段=...之后。"},{q:"Everyone went ______ John, who was ill.",o:["besides","except","except for","as well as"],a:1,e:"except排除。besides包括。"}],pastExam:[{y:2018,q:"Which of the following italicized words DOES NOT carry the metaphorical meaning? (A. behind this change of plan / B. standing behind him / C. getting terribly behind / D. parents were behind me)",o:["A","B","C","D"],a:1,e:"B 项 behind 为字面义「站在他身后」，其余三个 behind 为隐喻义（原因/落后/支持）。"},{y:2023,q:"He has an advantage ______ other candidates.",o:["over","than","to","against"],a:0,e:"advantage over...相对于...的优势。"},{y:2021,q:"The picture reminds me ______ my childhood.",o:["of","to","about","in"],a:0,e:"remind sb. of sth.使某人想起。"},{y:2019,q:"Are you familiar ______ the local customs?",o:["to","with","for","about"],a:1,e:"be familiar with某人对...熟悉。"},{y:2017,q:"He was absent ______ school because of illness.",o:["in","at","from","to"],a:2,e:"be absent from缺席。"},{y:2015,q:"Congratulations ______ your promotion!",o:["for","on","to","with"],a:1,e:"congratulations on...祝贺。"}]},{id:'modals',title:'情态动词',desc:'推测用法及have done结构',content:`<h3>情态动词</h3><h4>一、表推测</h4><table><tr><th>可能性</th><th>对现在/将来</th><th>对过去</th></tr><tr><td>肯定</td><td>must do</td><td>must have done</td></tr><tr><td>很可能</td><td>should/ought to do</td><td>should/ought to have done</td></tr><tr><td>可能</td><td>may/might/could do</td><td>may/might/could have done</td></tr><tr><td>不可能</td><td>can't/couldn't do</td><td>can't/couldn't have done</td></tr></table><h4>二、"情态动词+have done"专四核心考点</h4><table><tr><th>结构</th><th>含义</th></tr><tr><td>must have done</td><td>一定做过(过去肯定推测)</td></tr><tr><td>can't/couldn't have done</td><td>不可能做过</td></tr><tr><td>may/might have done</td><td>可能做过</td></tr><tr><td>could have done</td><td>本可做而未做</td></tr><tr><td>should/ought to have done</td><td>本应做而未做</td></tr><tr><td>shouldn't have done</td><td>本不该做却做了</td></tr><tr><td>needn't have done</td><td>本不必做却做了</td></tr></table><p>shall用于二/三人称表命令、威胁、允诺。used to(过去状态+习惯)vs would(仅重复动作非状态)。</p>`,practice:[{q:"You ______ me earlier. I could have helped you.",o:["should tell","should have told","must tell","could tell"],a:1,e:"should have done本应做而未做。"},{q:"The road is wet. It ______ last night.",o:["must rain","must have rained","should rain","should have rained"],a:1,e:"对过去肯定推测→must have done。"},{q:"He ______ the exam, for he looked so happy.",o:["can't have passed","must have passed","should have passed","could have passed"],a:1,e:"根据高兴推断→must have passed。"}],pastExam:[{y:2018,q:"My mother was determined to help those in need and she would have been immensely proud of what has been achieved these last 20 years. The italicized part in the sentence expresses _______.",o:["a hypothesis","a suggestion","a contradiction","a surprise"],a:0,e:"would have been proud 在此表对过去的推测/假设（hypothesis）。"},{y:2023,q:"You ______ the meeting. It was really important.",o:["shouldn't have missed","mustn't miss","can't have missed","needn't miss"],a:0,e:"本不该缺席→shouldn't have done。"},{y:2022,q:"From what you say, he ______ the truth already.",o:["must know","must have known","should know","can know"],a:1,e:"already+语境→must have known。"},{y:2020,q:"He ______ his homework, for his desk was empty.",o:["must finish","must have finished","should finish","could finish"],a:1,e:"was empty提示过去→must have done。"},{y:2019,q:"You ______ him. He was at home all day.",o:["could have seen","couldn't have seen","should have seen","must have seen"],a:1,e:"He was at home→不可能见过→couldn't have seen。"},{y:2018,q:"I ______ him the money. He never paid me back.",o:["shouldn't lend","mustn't have lent","shouldn't have lent","couldn't have lent"],a:2,e:"后悔不该借钱→shouldn't have done。"},{y:2017,q:"You needn't ______ all the way here. I could have met you at the station.",o:["come","came","have come","to come"],a:2,e:"needn't have done本不必做却做了。"}]},{id:'comparison',title:'比较结构',desc:'比较级、最高级及特殊比较句型',content:`<h3>比较结构</h3><table><tr><th>结构</th><th>例句</th></tr><tr><td>as+原级+as</td><td>He is as tall as his father.</td></tr><tr><td>not so/as+原级+as</td><td>He is not so clever as his brother.</td></tr><tr><td>比较级+than</td><td>She is taller than me.</td></tr><tr><td>the+比较级,the+比较级</td><td>The more you read, the better.</td></tr><tr><td>比较级+and+比较级</td><td>colder and colder</td></tr></table><p><strong>倍数表达：</strong>倍数+as...as / 倍数+比较级+than / 倍数+the size/length of<br><strong>比较中替代：</strong>单数/不可数→that；复数→those<br><strong>no more than(=only仅仅) vs not more than(不超过)<br>more...than 与其说...不如说</strong></p>`,practice:[{q:"The population of China is larger than ______ of Japan.",o:["one","that","those","ones"],a:1,e:"不可数名词用that替代。"},{q:"The harder you work, ______ progress you will make.",o:["the more","more","the most","most"],a:0,e:"the+比较级,the+比较级。"},{q:"This box is five times ______ that one.",o:["as heavy as","as heavy than","heavier as","heavy as"],a:0,e:"倍数+as+原级+as。"}],pastExam:[{y:2018,q:"At ____________, photography is a chemical process, during which a light-sensitive material is altered when exposed to light.",o:["its most basic","its basic","the most basic","the basic"],a:0,e:"at its most basic = 在最基本的层面上。"},{y:2019,q:"Moving from beginning to end by order of time, narration relies on a more natural pattern of organization than ______.",o:["do other types of writing","other types of writing","on other types of writing","other types of writing do so"],a:1,e:"比较对象是 narration 和 other types of writing，than 后省略相同部分。"},{y:2022,q:"Few eyewitnesses give us _______ of actual life on the battlefront as Stephen Crane...",o:["so keen a sense","a sense so keen","a so keen sense","so a keen sense"],a:1,e:"so + adj. + a + n. 结构：so keen a sense。"},{y:2022,q:"...more Hispanic and black students are majoring in... than _______.",o:["are being hired","hired","being hired","are hiring"],a:0,e:"比较状语从句的平行结构。than + 从句，主语 students 被雇佣→are being hired。"},{y:2022,q:"The hole in the stratospheric ozone layer... did not grow as fast this year _______ on average...",o:["as it did","as that did","as they did","as those did"],a:1,e:"as...as 比较结构。that 指代 the hole 的单数含义，did 代指 grew。"},{y:2022,q:"The house rent is higher than ______ in the countryside.",o:["that","one","those","ones"],a:0,e:"rent不可数→that替代。"},{y:2020,q:"John is ______ of the two brothers.",o:["the taller","taller","the tallest","tallest"],a:0,e:"两者中较...用the+比较级。"},{y:2018,q:"He is ______ than his brother.",o:["more hardworking","the more hardworking","most hardworking","more hardworkinger"],a:0,e:"多音节词比较级→more+原级。"},{y:2016,q:"This room is twice ______ that one.",o:["the size of","as large than","larger of","size of"],a:0,e:"倍数+the+名词+of。"}]},{id:'pronouns',title:'代词',desc:'不定代词、反身代词及替代词',content:`<h3>代词</h3><table><tr><th>代词</th><th>用法</th></tr><tr><td>both/either/neither</td><td>both两者都; either两者之一; neither两者都不</td></tr><tr><td>all/none</td><td>all三者+; none三者+都不</td></tr><tr><td>other/others/the other/another</td><td>other+n.其他的; others=other+n.; the other(两者)另一个; another(三者+)另一个</td></tr><tr><td>nothing but / anything but</td><td>nothing but=only仅仅; anything but=not at all根本不</td></tr></table>`,practice:[{q:"I have two brothers. One is a teacher, and ______ is a doctor.",o:["another","the other","other","others"],a:1,e:"两者中一个...另一个=one...the other。"},{q:"He is ______ but a child. Don't take it seriously.",o:["anything","nothing","something","everything"],a:1,e:"nothing but=only仅仅。"},{q:"______ of the two answers is correct.",o:["Both","Either","Neither","None"],a:2,e:"两者都不→Neither。谓语is单数。"}],pastExam:[{y:2022,q:"'The manager interviewed Tony himself...' — himself refers to _______.",o:["the manager","the verb","Tony","the action"],a:1,e:"反身代词 himself 强调动作本身（manager 亲自/本人去面试）。"},{y:2021,q:"Some people prefer tea; ______ prefer coffee.",o:["other","others","the other","another"],a:1,e:"others=other people泛指其他人。"},{y:2019,q:"I have three pens. One is red, ______ are blue.",o:["the others","others","another","the other"],a:0,e:"三者+其余全部→the others。"},{y:2017,q:"He is anything ______ a fool.",o:["but","except","besides","and"],a:0,e:"anything but=not at all根本不。"}]},{id:'adjadv',title:'形容词与副词',desc:'形容词排序、形近副词、表语形容词',content:`<h3>形容词与副词</h3><h4>一、形近副词辨析</h4><table><tr><th>无-ly（具体）</th><th>有-ly（抽象）</th></tr><tr><td>high 高地</td><td>highly 高度地，非常</td></tr><tr><td>deep 深地</td><td>deeply 深深地(情感)</td></tr><tr><td>wide 宽地</td><td>widely 广泛地</td></tr><tr><td>close 接近地</td><td>closely 仔细地；密切地</td></tr><tr><td>late 迟地</td><td>lately 最近</td></tr><tr><td>hard 努力地</td><td>hardly 几乎不</td></tr><tr><td>free 免费地</td><td>freely 自由地</td></tr></table><h4>二、a-开头表语形容词</h4><p>alive, asleep, awake, alone, alike, afraid, ashamed, aware, afloat →只作表语，不作前置定语。可说the baby is asleep，不能说an asleep baby→a sleeping baby。</p><h4>三、形容词排序</h4><p>限观形龄色国材：限定词→观点→大小→形状→年龄→颜色→国籍→材料</p>`,practice:[{q:"He was ______ praised for his courageous act.",o:["high","highly","tall","tallly"],a:1,e:"highly=高度地，非常(抽象)。"},{q:"I ______ had time to finish the test.",o:["hard","hardly","nearly","almost"],a:1,e:"hardly=almost not几乎不。"},{q:"He was the only person ______ at that late hour.",o:["awake","waking","waken","awaken"],a:0,e:"awake表语形容词'醒着的'。"}],pastExam:[{y:2018,q:"She was once a young country wife with chickens in the backyard and a view of _____________ mountains behind the apple orchard.",o:["blue hazy Virginia","Virginia hazy blue","hazy blue Virginia","Virginia blue hazy"],a:2,e:"形容词排序规则：观点/性质(hazy)→颜色(blue)→专有名词(Virginia)。"},{y:2023,q:"Sentence ___ expresses the highest degree of possibility? (should / may / might / could)",o:["may","might","should","could"],a:2,e:"四个情态动词中把握度最高的是 should，其次是 may，最后是 might 和 could。"},{y:2023,q:"She is smarter than ______ in her class.",o:["any boy","any other boy","any boys","all boys"],a:1,e:"比较级+any other+单数名词。指她比班上任何其他人都聪明。"},{y:2023,q:"This kind of fruit is ______ found in tropical areas.",o:["wide","widely","wildly","wild"],a:1,e:"widely广泛地(抽象)。"},{y:2021,q:"He was ______ respected by his colleagues.",o:["high","highly","tall","deep"],a:1,e:"highly respected非常受尊敬。"},{y:2019,q:"I have been working too ______ lately.",o:["hard","hardly","heavy","heavily"],a:0,e:"work hard努力工作。lately=recently最近。"},{y:2017,q:"The ______ child was sleeping soundly.",o:["asleep","sleeping","slept","sleep"],a:1,e:"a-开头表语形容词不作前置定语→用sleeping。"}]},{id:'conjunctions',title:'连词与逻辑',desc:'并列连词、从属连词及逻辑衔接',content:`<h3>连词与逻辑</h3><h4>易混连词</h4><table><tr><th>对比</th><th>区别</th></tr><tr><td>while vs when vs as</td><td>while+延续/进行；when泛指时间点/段；as同时性/随着</td></tr><tr><td>because vs since vs as vs for</td><td>because最强(直接原因回答why)；since既然(已知原因)；as由于(弱)；for补充推断</td></tr><tr><td>unless vs if...not</td><td>unless=if...not，但不用于假设条件句</td></tr></table><p>常用逻辑连接词：转折(however, nevertheless, yet, on the contrary)；因果(therefore, consequently, as a result)；递进(moreover, furthermore, in addition)；举例(for example, such as)；总结(in conclusion, to sum up)</p>`,practice:[{q:"______ he is poor, he is honest and generous.",o:["Because","When","While","If"],a:2,e:"while表让步对比=although虽然。"},{q:"You won't succeed ______ you work harder.",o:["if","unless","when","because"],a:1,e:"unless=if...not除非/如果不。"},{q:"He must be ill, ______ he is absent today.",o:["because","since","as","for"],a:3,e:"for补充说明/推断原因。"}],pastExam:[{y:2017,q:"______ combination of techniques authors use, all stories... have a plot.",o:["However","Whatever","Whichever","No matter"],a:1,e:"Whatever = No matter what。Whatever combination = 无论用什么组合。"},{y:2022,q:"______ the task is difficult, they managed to complete it on time.",o:["While","Because","Since","If"],a:0,e:"While表让步=Although。"},{y:2020,q:"I'll go to the party ______ I am invited.",o:["unless","if","whether","provided that"],a:3,e:"provided that=if只要/如果。"},{y:2018,q:"He must be tired, ______ he has been working all day.",o:["because","for","since","as"],a:1,e:"for补充说明推断原因。"}]}]},{id:'vocab',icon:'◰',name:'词汇辨析',intro:'专四词汇题重点考查近义词辨析、形近词区分和固定搭配。每题15分，占比较大。',topics:[{id:'synonyms',title:'近义词辨析',desc:'高频近义词组的精确含义区分，含历年真题',content:`<h3>近义词辨析</h3><h4>1. "看"动词</h4><table><tr><th>动词</th><th>含义</th></tr><tr><td>see</td><td>看见（结果）；理解</td></tr><tr><td>look(at)</td><td>看（动作）；注意</td></tr><tr><td>watch</td><td>观看（动态、持续地）</td></tr><tr><td>glance(at)</td><td>一瞥，扫视（快速看）</td></tr><tr><td>stare(at)</td><td>凝视，瞪着眼看</td></tr><tr><td>gaze(at)</td><td>凝视（深情/沉思地）</td></tr><tr><td>glare(at)</td><td>怒视</td></tr><tr><td>glimpse</td><td>瞥见（强调结果）</td></tr></table><h4>2. rise/raise/arise/arouse</h4><table><tr><th>动词</th><th>及物</th><th>含义</th></tr><tr><td>rise(rose,risen)</td><td>vi.</td><td>上升；起身；增长</td></tr><tr><td>raise(raised)</td><td>vt.</td><td>举起；提高；养育；筹集</td></tr><tr><td>arise(arose,arisen)</td><td>vi.</td><td>出现；产生（问题/情况）</td></tr><tr><td>arouse(aroused)</td><td>vt.</td><td>唤醒；激起（兴趣/愤怒）</td></tr></table><h4>3. 高频形近词</h4><table><tr><th>词组</th><th>区别</th></tr><tr><td>continual/continuous</td><td>continual断断续续的; continuous连续不断的</td></tr><tr><td>economic/economical</td><td>经济的(宏观); 节约的</td></tr><tr><td>historic/historical</td><td>有历史意义的; 历史的(事实性)</td></tr><tr><td>imaginable/imaginary/imaginative</td><td>可想象的; 虚构的; 有想象力的</td></tr><tr><td>respectable/respectful/respective</td><td>可敬的; 尊敬的(对别人); 各自的</td></tr><tr><td>sensible/sensitive</td><td>明智的; 敏感的</td></tr><tr><td>principal/principle</td><td>主要的/校长; 原则</td></tr><tr><td>complement/compliment</td><td>补充; 赞美</td></tr><tr><td>stationary/stationery</td><td>静止的; 文具</td></tr><tr><td>assure/ensure/insure</td><td>assure sb. that使放心; ensure sth.确保; insure保险</td></tr><tr><td>affect/effect</td><td>affect v.影响; effect n.效果 v.实现</td></tr></table>`,practice:[{q:"The sun ______ in the east.",o:["rises","raises","arises","arouses"],a:0,e:"rise vi.上升。raise vt.举起。"},{q:"Pollution can seriously ______ people's health.",o:["effect","affect","affection","efficiency"],a:1,e:"affect v.影响。effect n.效果。"},{q:"She is very ______ to criticism.",o:["sensible","sensitive","sense","sensational"],a:1,e:"sensitive敏感的。sensible明智的。"},{q:"Please ______ me when you arrive at the airport.",o:["assure","ensure","insure","make sure"],a:1,e:"ensure+that/名词确保。assure+sb.使放心。"}],pastExam:[{y:2018,q:"_________, the most controversial candidate in the election campaign, he has been strongly criticized for his crude comments about women.",o:["Questionably","Arguably","Contentiously","Debatably"],a:1,e:"Arguably 修饰最高级，意为「可论证地/可以说」。Questionably = 可疑地。"},{y:2018,q:"Prices have recently risen in order to __________ the increased cost of raw materials.",o:["cut","buoy","offer","offset"],a:3,e:"offset = 抵消。价格上涨以抵消原材料成本上涨。"},{y:2018,q:"The celebrity says in court papers she 'has no __________ of giving any authorization to anyone to proceed with a divorce.'",o:["recommendation","recording","recollection","recognition"],a:2,e:"have no recollection of = 不记得/没有记忆。"},{y:2018,q:"What actually __________ a good angle — or a good selfie overall — is rooted in what we consider beautiful.",o:["consists","constitutes","composes","constructs"],a:1,e:"constitute = 构成/是。What constitutes a good angle = 什么构成好的角度。"},{y:2018,q:"Last March the __________ of a 19th century cargo ship was found by an underwater archaeological team.",o:["debris","ruins","remains","wreck"],a:3,e:"wreck 特指沉船残骸。debris 泛指碎片；ruins 建筑物废墟；remains 遗体/遗物。"},{y:2018,q:"She's worn his designs on __________ occasions from red carpets to movie premieres.",o:["countless","countable","numerical","numeral"],a:0,e:"countless = 无数的。numerical 数字的；numeral 数字符号；countable 可数的。"},{y:2018,q:"A leading ___________ intelligence and operations company has released its analysis of worldwide reported incidents of piracy and crime against mariners.",o:["oceangoing","oceanic","marine","maritime"],a:3,e:"maritime = 海事的/与海上商业活动相关的。marine 偏重海洋生物/环境。"},{y:2019,q:"...medical ______",o:["faculty","members","personnel","staff"],a:2,e:"medical personnel = 医务人员。personnel 为集合名词「全体人员」。faculty 指「全体教师」。"},{y:2019,q:"...so many ______ feelings...",o:["injured","injurious","hurting","hurtful"],a:0,e:"injured feelings = 受到伤害的感情。injurious = 造成伤害的（含义不同）。"},{y:2019,q:"...falsely ______ 'Fire!'...",o:["yell","yelp","yank","yield"],a:0,e:"yell = 喊叫。yelp = 尖叫（因痛）；yank = 猛拉；yield = 屈服。"},{y:2019,q:"FC Barcelona, ______ the most iconic club...",o:["arguably","debatably","questionably","controversially"],a:0,e:"arguably 常修饰最高级，意为「可以说/可论证地」。"},{y:2019,q:"...liquid vitamins ______ designed for children under 3.",o:["specially","especially","particularly","specifically"],a:3,e:"specifically = 特定地/专门针对（含「仅限于」意味）。specially = 特意（为某种目的）。"},{y:2022,q:"...historical novel... is of _______ importance.",o:["inferior","secondary","minor","subordinate"],a:1,e:"of secondary importance = 次要的/次重要的。"},{y:2022,q:"...paperback full of fast action and _______ dialogue.",o:["brisk","quick","fast","rapid"],a:0,e:"brisk dialogue = 轻快活泼的对白。"},{y:2022,q:"...many contemporary writers avoid it, considering it too contrived and _______.",o:["arbitrary","artificial","fake","superficial"],a:0,e:"arbitrary = 武断的/任意的。contrived and arbitrary = 做作且武断。"},{y:2022,q:"The team's efforts to score were _______ by the opposing goalkeeper.",o:["discouraged","frustrated","hindered","blocked"],a:1,e:"frustrated = 挫败。守门员挫败了球队的得分努力。"},{y:2022,q:"...products and services that suit the customer's _______.",o:["comfort","convenience","ease","suitability"],a:1,e:"suit the customer's convenience = 方便顾客。"},{y:2022,q:"'stream of consciousness' is used to describe the _______ of thoughts...",o:["procession","progression","prosecution","persecution"],a:0,e:"procession of thoughts = 思绪的流动/涌现。意识流。"},{y:2022,q:"...a protagonist _______ lacking in... attributes of a traditional hero.",o:["conspicuously","obviously","noticeably","visibly"],a:0,e:"conspicuously = 明显地/引人注目地。「一个明显缺乏传统英雄特质的主角」。"},{y:2017,q:"She was once a young country wife with chickens in the backyard. (词汇: characters)",o:["personalities","characters","individuals","persons"],a:1,e:"characters = （文学作品/故事中的）角色/人物。"},{y:2017,q:"ensure the safety of the food supply",o:["assure","ensure","insure","secure"],a:1,e:"ensure = 确保（ensure sth.）。assure + sb. 使放心；insure 保险。"},{y:2017,q:"relieve the pain",o:["release","relieve","remove","reduce"],a:1,e:"relieve the pain = 缓解疼痛。"},{y:2017,q:"releases the hormone",o:["releases","relieves","removes","reduces"],a:0,e:"release the hormone = 释放激素。"},{y:2017,q:"indicative of his attitude",o:["indicative","indicating","indicated","indication"],a:0,e:"be indicative of = 表明/暗示。"},{y:2017,q:"critically important",o:["critically","crucially","essentially","vitally"],a:0,e:"critically important = 极其重要的。"},{y:2017,q:"invariably the same",o:["invariably","constantly","continuously","permanently"],a:0,e:"invariably = 始终如一地/一成不变地。"},{y:2023,q:"The new policy is ______ to come into effect next month.",o:["likely","probable","possible","liable"],a:0,e:"be likely to do很可能。probable不能用于sb.is~to do。"},{y:2022,q:"He ______ his voice so that everyone could hear him.",o:["rose","raised","arose","aroused"],a:1,e:"raise one's voice提高嗓音(及物)。rise不及物。"},{y:2020,q:"She is very ______; she always makes wise decisions.",o:["sensitive","sensible","sensational","senseless"],a:1,e:"sensible明智的。sensitive敏感的。"},{y:2019,q:"It is difficult to ______ the long-term effects of this policy.",o:["anticipate","predict","forecast","foretell"],a:1,e:"predict预测(基于推理分析)。forecast预报(天气/经济)。"},{y:2018,q:"The scientist's discovery was of ______ importance.",o:["historic","historical","history","historian"],a:0,e:"historic有历史意义的(具有里程碑性质)。historical与历史相关的。"},{y:2017,q:"A good teacher should be able to ______ his students.",o:["motivate","encourage","inspire","stimulate"],a:2,e:"inspire激发灵感/热情。motivate给予动机。encourage鼓励。stimulate刺激。"},{y:2016,q:"These two concepts are closely ______ to each other.",o:["connected","linked","related","associated"],a:2,e:"be related to与...相关。be connected to与...连接。be associated with与...联系。"},{y:2015,q:"The company is taking measures to ______ the crisis.",o:["handle","deal","cope","resolve"],a:3,e:"resolve the crisis解决危机。handle/deal with/cope with处理。"}]},{id:'collocations',title:'固定搭配',desc:'高频短语动词及介词搭配',content:`<h3>固定搭配</h3><h4>高频短语动词</h4><table><tr><th>短语</th><th>含义</th><th>短语</th><th>含义</th></tr><tr><td>account for</td><td>解释；占比</td><td>come up with</td><td>想出（主意）</td></tr><tr><td>break down</td><td>出故障；分解</td><td>cut down on</td><td>减少</td></tr><tr><td>break up</td><td>分手；解散</td><td>figure out</td><td>弄清楚</td></tr><tr><td>bring about</td><td>引起，导致</td><td>get over</td><td>克服；恢复</td></tr><tr><td>call off</td><td>取消</td><td>give in(to)</td><td>屈服，让步</td></tr><tr><td>carry out</td><td>执行，实施</td><td>hold up</td><td>耽搁；支撑</td></tr><tr><td>come across</td><td>偶然遇到</td><td>keep up with</td><td>跟上</td></tr><tr><td>live up to</td><td>不辜负(期望)</td><td>look down on</td><td>看不起</td></tr><tr><td>look into</td><td>调查</td><td>make up for</td><td>弥补</td></tr><tr><td>put off</td><td>推迟</td><td>put up with</td><td>忍受</td></tr><tr><td>run into</td><td>偶遇；遭遇</td><td>run out of</td><td>用完，耗尽</td></tr><tr><td>take after</td><td>长得像(家人)</td><td>turn down</td><td>拒绝</td></tr><tr><td>turn out</td><td>结果是，证明是</td><td>work out</td><td>解决；锻炼</td></tr></table>`,practice:[{q:"I really ______ my father—we both love music.",o:["take after","take off","take over","take in"],a:0,e:"take after=resemble长得像/性格像。"},{q:"We have ______ sugar. Could you buy some?",o:["run out","run out of","run into","run over"],a:1,e:"run out of及物(+宾语)。run out不及物。"},{q:"The meeting has been ______ due to the bad weather.",o:["called off","called for","called on","called up"],a:0,e:"call off=cancel取消。"},{q:"It took him months to ______ the illness.",o:["get through","get over","get away","get off"],a:1,e:"get over从疾病/困难中恢复。"}],pastExam:[{y:2018,q:"When the police officers who took part in the King beating were first brought to ___________, their lawyers used the videotape as evidence against the prosecution.",o:["justice","testimony","trial","verdict"],a:2,e:"bring to trial = 带上法庭受审。"},{y:2018,q:"The school is going the ________ mile to create the next generation of sporting stars thanks to its unique development program.",o:["final","further","supplementary","extra"],a:3,e:"go the extra mile = 加倍努力/付出额外努力（固定搭配）。"},{y:2018,q:"The teachers' union _________ a lawsuit against the district calling for repairing 'deplorable' school conditions.",o:["fired","filed","fined","filled"],a:1,e:"file a lawsuit = 提起诉讼。fire 解雇；fine 罚款；fill 填充。"},{y:2019,q:"...a local food economy that is ______ to any environment.",o:["adoptable","amendable","alterable","adaptable"],a:3,e:"be adaptable to = 适应……。adoptable = 可采用的；amendable = 可修正的。"},{y:2019,q:"...he has no second ______ about...",o:["thoughts","opinions","ideas","views"],a:0,e:"have no second thoughts = 不再考虑/没有别的想法（固定搭配）。"},{y:2019,q:"...be subject ______ the same taxes...",o:["for","on","to","at"],a:2,e:"be subject to = 须遵守/须缴纳（固定搭配）。"},{y:2019,q:"The three law ______ officers...",o:["enforcement","enforcing","enforced","enforce"],a:0,e:"law enforcement officers = 执法人员（固定搭配）。"},{y:2022,q:"Police... _______ to the public for any video footage...",o:["requested","appealed","demanded","asked"],a:1,e:"appeal to sb for sth = 呼吁/恳请。"},{y:2022,q:"...it is doubtful if she will _______.",o:["pull up","pull through","pull over","pull out"],a:1,e:"pull through = 渡过难关。pull up 停车；pull over 路边停车；pull out 退出。"},{y:2022,q:"Tom sat at the dining table... and _______ his lips.",o:["licked","smacked","pressed","pursed"],a:1,e:"smack one's lips = 咂嘴。"},{y:2017,q:"eye the changes",o:["watch","eye","see","look"],a:1,e:"eye = 注视/观察（动词用法）。"},{y:2017,q:"on the decline",o:["in","at","on","with"],a:2,e:"on the decline = 在下降中（固定搭配）。"},{y:2017,q:"bound to happen",o:["like","likely","possible","bound"],a:3,e:"be bound to = 一定会/注定会。"},{y:2023,q:"We need to ______ a solution to this problem.",o:["come up with","put up with","keep up with","catch up with"],a:0,e:"come up with提出/想出(主意方案)。"},{y:2021,q:"The old building was ______ to make room for a new park.",o:["torn down","put down","taken down","set down"],a:0,e:"tear down=pull down拆除。"},{y:2019,q:"Don't ______ what he said. He was just joking.",o:["take...seriously","take...lightly","take...easy","take...for granted"],a:0,e:"take sth. seriously认真对待。"},{y:2017,q:"I can't ______ the noise anymore.",o:["put up with","come up with","keep up with","get on with"],a:0,e:"put up with=tolerate忍受。"}]}]},{id:'cloze',icon:'◈',name:'完形填空',intro:'综合考查词汇辨析、语法知识和篇章理解能力。专四固定题型。',topics:[{id:'cloze-skills',title:'完形填空技巧',desc:'解题步骤、考点分布和逻辑衔接词',content:`<h3>完形填空解题技巧</h3><h4>一、解题四步法</h4><ol><li><strong>通读全文</strong>：跳过空格，把握主旨大意</li><li><strong>逐题分析</strong>：利用上下文线索、词汇搭配、语法规则</li><li><strong>先易后难</strong>：先做确定的选择，缩小后续范围</li><li><strong>复读检查</strong>：代入全部选项，检查逻辑是否通顺</li></ol><h4>二、考点分布</h4><table><tr><th>考点</th><th>占比</th><th>解题思路</th></tr><tr><td>词汇辨析</td><td>~40%</td><td>根据上下文选择最恰当的词</td></tr><tr><td>固定搭配</td><td>~20%</td><td>熟记常见短语动词和介词搭配</td></tr><tr><td>语法结构</td><td>~15%</td><td>分析句子成分，选对连词和关系词</td></tr><tr><td>逻辑衔接</td><td>~15%</td><td>判断前后句的因果、转折、递进关系</td></tr><tr><td>上下文线索</td><td>~10%</td><td>原词复现、同义替换、反义对照</td></tr></table><h4>三、高频逻辑衔接词</h4><table><tr><th>逻辑关系</th><th>常见连接词</th></tr><tr><td>转折</td><td>however, nevertheless, yet, but, on the contrary, instead</td></tr><tr><td>因果</td><td>therefore, consequently, as a result, thus, hence, so</td></tr><tr><td>递进</td><td>moreover, furthermore, in addition, besides, what's more</td></tr><tr><td>举例</td><td>for example, for instance, such as, namely</td></tr><tr><td>总结</td><td>in conclusion, to sum up, in short, overall</td></tr></table><div class="tip"><span class="ti">✦</span><div><strong>核心原则：</strong>完形填空的答案一定在上下文中能找到线索。不确定时扩大阅读范围寻找关键词。</div></div>`,practice:[{q:"完形填空的正确解题顺序是？",o:["逐题翻译","通读→逐题→复读","先做难题","只凭语感"],a:1,e:"四步法：通读全文→逐题分析→先易后难→复读检查。"},{q:"The weather was terrible; ______, we cancelled the trip.",o:["therefore","however","moreover","meanwhile"],a:0,e:"因果关系→therefore因此。"}],pastExam:[]}]},{id:'reading',icon:'◧',name:'阅读理解',intro:'专四阅读含选择题和简答题。考查理解、推断和概括能力。',topics:[{id:'reading-skills',title:'阅读理解技巧',desc:'五大题型解题方法及答题策略',content:`<h3>阅读理解</h3><h4>一、五大题型</h4><table><tr><th>题型</th><th>标志词</th><th>解题方法</th></tr><tr><td>主旨大意题</td><td>main idea, mainly about, title, purpose</td><td>关注首尾段、各段首尾句；排除以偏概全的选项</td></tr><tr><td>事实细节题</td><td>according to, which is true, the author mentions</td><td>关键词定位→同义替换是答案（原句复现通常是陷阱）</td></tr><tr><td>推理判断题</td><td>infer, imply, suggest, conclude, learn from</td><td>基于原文一步推理，不主观联想</td></tr><tr><td>词义猜测题</td><td>the word "X" means..., is closest in meaning to</td><td>上下文语境、构词法、前后对比关系</td></tr><tr><td>态度观点题</td><td>attitude, tone, feel, the author thinks/believes</td><td>注意情感形容词/副词，区分客观与主观</td></tr></table><h4>二、答题策略</h4><ol><li><strong>先读题干再读文章</strong>—带着问题定位</li><li><strong>题序对应段序</strong>—题目顺序与段落顺序基本一致</li><li><strong>同义替换是答案</strong>—与原文措辞高度相同的通常是干扰项</li><li><strong>绝对化表达慎选</strong>—含only/must/all/never/completely的选项需严格验证</li><li><strong>简答题≤10词</strong>—直接精炼，用原文关键词</li></ol><h4>三、常见干扰项特征</h4><ul><li>张冠李戴：信息来自文中其他部分</li><li>无中生有：文中未提及的信息</li><li>过度推断：推理超过一步</li><li>以偏概全：用细节代替主旨</li><li>绝对化：使用all, never, only, must等极端词</li></ul>`,practice:[{q:"主旨大意题答案通常在文章的______。",o:["中间段落","首尾段","例子中","图表中"],a:1,e:"主旨大多在首尾段及段落首尾句。"},{q:"事实细节题正确选项通常是______。",o:["原文原句","同义替换","主观判断","绝对化表达"],a:1,e:"同义替换是答案特征。"},{q:"推理判断题的黄金原则是______。",o:["多步推理","推理不过一","主观推测","凭经验判断"],a:1,e:"基于原文进行一步推理。"}],pastExam:[]}]},{id:'writing',icon:'✎',name:'写作',intro:'专四写作包含命题作文(200词)和便条(50-60词)。本板块汇总历年真题并提供详细思路和范文。',topics:[{id:'composition',title:'命题作文',desc:'议论文结构、历年真题与范文思路',content:`<h3>命题作文 (200词/45分钟)</h3><h4>一、三段式结构</h4><table><tr><th>段落</th><th>功能</th><th>建议词数</th></tr><tr><td>引言段</td><td>引出话题+表明立场</td><td>~40词</td></tr><tr><td>主体段</td><td>论述观点+举例/分析(2-3个论点)</td><td>~120词</td></tr><tr><td>结论段</td><td>总结观点+升华/建议</td><td>~40词</td></tr></table><h4>二、高分句型</h4><p><strong>引言：</strong>Nowadays,there is a growing concern about... / It is widely believed that... / When it comes to..., opinions vary.</p><p><strong>论证：</strong>To begin with...For instance... / Another reason is that...A case in point is... / It is universally acknowledged that...</p><p><strong>结论：</strong>Taking all factors into account, we may safely draw the conclusion that... / Only by...can we...(倒装加分)</p><h4>三、高分技巧</h4><ul><li>使用连接词(firstly,furthermore,nevertheless,consequently)</li><li>多样化句式(倒装、强调、虚拟、定语从句交错使用)</li><li>高级词汇替换(important→significant/crucial/vital; many→numerous; think→believe/hold/argue)</li><li>避免口语化(不用wanna,gonna;can't→cannot)</li></ul>`,practice:[{q:"专四作文字数要求约为______。",o:["100词","150词","200词","300词"],a:2,e:"专四命题作文200词左右，45分钟。"},{q:"以下哪项不是高分写作要素？",o:["多样化句式","使用连接词","多用口语化表达","高级词汇替换"],a:2,e:"学术写作应避免口语化。"}],pastExam:[{y:2023,q:"Will online learning replace traditional classroom education?",o:[],a:-1,e:"<b>思路要点：</b><br>引言段：在线教育普及→但完全替代传统教育可能性不大<br>主体段1：在线教育优势—灵活方便、资源丰富、个性化学习<br>主体段2：传统教育不可替代—面对面互动、社交能力培养、实践操作<br>结论段：两者融合(blended learning)是未来趋势，取长补短<br><br><b>关键词汇：</b>flexibility, personalized learning, face-to-face interaction, social skills, hands-on experience, blended learning, complement rather than replace<br><b>参考句型：</b>While online education offers..., traditional classroom teaching remains indispensable because... / The ideal approach is to combine the best of both worlds."},{y:2022,q:"Is it necessary for college students to take part-time jobs?",o:[],a:-1,e:"<b>思路要点：</b><br>引言段：大学生兼职现象普遍→利大于弊<br>主体段1：有利方面—经济独立、积累工作经验、培养时间管理能力<br>主体段2：需注意—不能影响学业、选择与专业相关的兼职更佳<br>结论段：在平衡学业前提下鼓励兼职<br><br><b>关键词汇：</b>financial independence, work experience, time management, strike a balance, priority, gain insight into, put theory into practice<br><b>参考句型：</b>Part-time jobs provide an invaluable opportunity for students to... / It is crucial that students strike a balance between work and study."},{y:2021,q:"Should students evaluate their teachers?",o:[],a:-1,e:"<b>思路要点：</b><br>引言段：师生互评越来越普遍→双刃剑<br>主体段1：有利—促进教学质量提升、让学生有发言权、建立双向沟通<br>主体段2：潜在问题—学生评价可能不客观、给教师带来额外压力<br>结论段：应合理设计评价体系，扬长避短<br><br><b>关键词汇：</b>evaluation system, teaching quality, constructive feedback, objective, reciprocal, accountability, take...into account<br><b>参考句型：</b>Student evaluations serve as a valuable tool for... / However, it is important that these evaluations be designed carefully to avoid..."},{y:2020,q:"Is it better to work in a big company or a small one?",o:[],a:-1,e:"<b>思路要点：</b><br>引言段：毕业生面临大小公司选择→各有利弊，因人而异<br>主体段1：大公司—完善的培训体系、明确的晋升路径、资源和名声、但晋升可能缓慢<br>主体段2：小公司—更多责任和成长空间、灵活的环境、扁平化管理、但福利和稳定性不如大公司<br>结论段：取决于个人性格和职业目标，无标准答案<br><br><b>关键词汇：</b>career development, corporate culture, promotion path, hands-on experience, entrepreneurship, stability, hierarchy, start-up environment<br><b>参考句型：</b>While big companies offer..., small firms provide... / The choice ultimately depends on one's personality and career aspirations."},{y:2019,q:"Is pressure a bad thing?",o:[],a:-1,e:"<b>思路要点：</b><br>引言段：压力是生活的一部分→有两面性<br>主体段1：积极作用—转化为动力(motivation)、提升表现、适度的压力激发潜能<br>主体段2：过度压力的危害—影响身心健康、降低效率、导致职业倦怠(burnout)<br>结论段：关键不是消除压力，而是学会管理压力<br><br><b>关键词汇：</b>motivation, productivity, mental health, stress management, optimal level of stress, double-edged sword, coping mechanism<br><b>参考句型：</b>Pressure, when kept at a moderate level, can serve as a powerful motivator. / The key lies not in avoiding pressure but in learning to manage it effectively."}]},{id:'note-writing',title:'便条写作',desc:'便条格式、分类表达与历年真题',content:`<h3>便条写作 (50-60词/10分钟)</h3><h4>一、格式五要素</h4><p><strong>日期(右上角)→ 称呼(Dear...,) → 正文(简洁完整) → 结尾敬语(Yours,/Sincerely,) → 签名</strong></p><h4>二、常见类型及核心表达</h4><table><tr><th>类型</th><th>核心表达</th></tr><tr><td>道歉(Apology)</td><td>I am terribly sorry that... / Please accept my sincere apology for... / I do apologize for...</td></tr><tr><td>邀请(Invitation)</td><td>I would like to invite you to... / I was wondering if you could come to... / Would you be interested in...</td></tr><tr><td>感谢(Thanks)</td><td>I am writing to express my heartfelt gratitude for... / Thank you so much for... / I really appreciate...</td></tr><tr><td>询问(Inquiry)</td><td>I am writing to ask about... / I would appreciate it if you could tell me... / Could you possibly...</td></tr><tr><td>请假(Leave)</td><td>I am writing to ask for a sick leave of... / Please excuse my absence from... / I am unable to attend...</td></tr><tr><td>建议(Suggestion)</td><td>I would like to suggest that... / It might be a good idea to... / Why don't you... / You may want to...</td></tr><tr><td>祝贺(Congratulation)</td><td>Congratulations on... / I am delighted to hear that... / Well done on...</td></tr></table><div class="tip"><span class="ti">✦</span><div><strong>评分要点：</strong>格式(日期+称呼+敬语+签名) + 内容(覆盖所有要点) + 语言(简洁有礼) + 语法拼写无误。缺一不可。</div></div>`,practice:[{q:"专四便条写作词数要求约______。",o:["30-40词","50-60词","80-100词","100-120词"],a:1,e:"便条约50-60词，10分钟内完成。"},{q:"便条写作哪项不是必须的？",o:["日期","称呼","标题","结尾敬语"],a:2,e:"便条不需要标题，但日期+称呼+敬语+签名必不可少。"}],pastExam:[{y:2023,q:"Write a note to your roommate, apologizing for not being able to attend his/her birthday party.",o:[],a:-1,e:"<b>范文要点：</b><br>日期 + Dear [Name],<br>正文：I am terribly sorry that I cannot attend your birthday party this Saturday. My cousin will arrive from Beijing that afternoon, and I need to pick him up at the airport. I have prepared a small gift for you and will give it to you when I return. Wish you a happy birthday!<br>Yours, [Name]<br><b>关键词：</b>terribly sorry, cannot attend, pick up, prepared a gift, wish you a happy birthday"},{y:2022,q:"Write a note to a friend, inviting him/her to a concert this weekend.",o:[],a:-1,e:"<b>范文要点：</b><br>日期 + Dear [Name],<br>正文：I wonder if you would be interested in going to a concert with me this Saturday evening. The band will be performing at the City Stadium. I have got two tickets. I am sure we will have a great time together. Looking forward to your reply.<br>Yours, [Name]<br><b>关键词：</b>would be interested in, concert, performing, tickets, looking forward to"},{y:2021,q:"Write a note to your professor, asking for an extension of the deadline.",o:[],a:-1,e:"<b>范文要点：</b><br>日期 + Dear Professor [Name],<br>正文：I am writing to ask whether it would be possible for me to submit my assignment a few days later. I have been ill for the past three days and was unable to complete it on time. I would greatly appreciate your understanding.<br>Yours respectfully, [Name]<br><b>关键词：</b>extension, submit, assignment, appreciate, understanding"},{y:2020,q:"Write a note to a classmate, thanking him/her for helping you prepare for the exam.",o:[],a:-1,e:"<b>范文要点：</b><br>日期 + Dear [Name],<br>正文：I am writing to express my sincere gratitude for your generous help. Without your patient tutoring, I could not have passed the difficult math exam. Please let me know if there is anything I can do for you in return.<br>Yours, [Name]<br><b>关键词：</b>gratitude, generous help, patient tutoring, passed the exam, in return"},{y:2019,q:"Write a note to a foreign teacher, recommending a tourist attraction in China.",o:[],a:-1,e:"<b>范文要点：</b><br>日期 + Dear Mr. [Name],<br>正文：Knowing that you plan to travel in China, I would strongly recommend the West Lake in Hangzhou. It is renowned for its picturesque scenery and rich cultural heritage. You can take a boat ride on the lake and visit ancient temples nearby. I am sure you will enjoy the trip immensely!<br>Yours, [Name]<br><b>关键词：</b>recommend, renowned for, picturesque scenery, cultural heritage, immensely"}]}]},{id:'listening',icon:'◉',name:'听力理解',intro:'专四听力包含听写(Dictation)和听力理解两部分。本板块提供技巧和备考策略。',topics:[{id:'dictation',title:'听写 (Dictation)',desc:'考试形式、技巧和练习方法',content:`<h3>听写 (Dictation)</h3><h4>一、考试形式</h4><p>80-100词短文，朗读<strong>4遍</strong>：</p><ul><li><strong>第1遍：</strong>正常语速，<span class="highlight">只听不写</span>，听懂大意</li><li><strong>第2、3遍：</strong>按意群停顿(15词停顿10秒)，<span class="highlight">逐句写</span></li><li><strong>第4遍：</strong>正常语速，<span class="highlight">检查核对</span></li></ul><p>满分15分，占听力50%。</p><h4>二、听写技巧</h4><ol><li>第1遍听懂大意和难点词汇</li><li>第2、3遍速记(先实词→补虚词，用缩写和符号)</li><li>第4遍查漏补缺(补标点、检查拼写和语法)</li><li>最后2分钟通读检查(主谓一致、冠词、单复数)</li></ol><div class="tip"><span class="ti">✦</span><div><strong>常见扣分：</strong>冠词遗漏、拼写错误(每处扣0.5)、标点误用、主谓不一致。</div></div><h4>三、备考建议</h4><ul><li>每天1-2篇听写，坚持30天</li><li>建立缩写系统(govt, imp, esp, b/c=because)</li><li>注意连读、弱读、失去爆破等语音现象</li><li>精听历年真题，反复听直到完全写出</li></ul>`,practice:[{q:"专四听写共朗读______遍。",o:["2","3","4","5"],a:2,e:"共读4遍：1遍理解+2遍书写+1遍检查。"},{q:"听写第一遍应______。",o:["逐词写","只听不写","写关键句","检查拼写"],a:1,e:"第一遍只听不写，把握主题。"},{q:"听写短文约______词。",o:["50-60","80-100","150-200","200-250"],a:1,e:"约80-100词。"}],pastExam:[]},{id:'listening-comp',title:'听力理解策略',desc:'对话和短文解题技巧',content:`<h3>听力理解</h3><h4>一、题型</h4><table><tr><th>Section</th><th>内容</th><th>题量</th></tr><tr><td>A</td><td>对话(Conversations)</td><td>10题</td></tr><tr><td>B</td><td>短文(Passages)</td><td>10题</td></tr></table><h4>二、核心技巧</h4><ol><li><strong>预读选项</strong>—听前快速预测话题和问题</li><li><strong>抓住转折词</strong>—but, however, actually, in fact后常是答案</li><li><strong>注意数字信息</strong>—时间、价格、年龄、号码</li><li><strong>判断态度</strong>—通过语调和用词(disappointed, thrilled, annoyed)</li><li><strong>速记关键</strong>—用缩写记who,what,when,where,why</li></ol><h4>三、场景高频词</h4><table><tr><th>场景</th><th>高频词</th></tr><tr><td>校园</td><td>semester, credit, assignment, lecture, dorm, scholarship, major, tuition</td></tr><tr><td>医院</td><td>symptom, prescription, appointment, surgery, diagnose, recovery</td></tr><tr><td>机场/车站</td><td>departure, arrival, delay, boarding, luggage, platform, terminal</td></tr><tr><td>酒店/餐厅</td><td>reservation, check-in, menu, bill, tip, room service</td></tr><tr><td>职场</td><td>interview, promotion, salary, resume, colleague, deadline, overtime</td></tr></table>`,practice:[{q:"听力中转折词后面通常______。",o:["不重要","是答案所在","是干扰信息","可以忽略"],a:1,e:"转折后是说话人真正意图。"},{q:"听力前最重要的准备工作是______。",o:["背单词","预读选项","做笔记","查语法"],a:1,e:"利用间隙快速预读选项。"}],pastExam:[]}]}]};

// ==================== APP LOGIC ====================
let currentCat=null,currentTopic=null,quizIdx=0,quizState={};

function init(){buildSidebar();showHome();loadApiKey();}

function buildSidebar(){
  let h=''; DATA.categories.forEach(c=>{
    let open=currentCat&&currentCat.id===c.id;
    h+=`<div class="cat-item"><button class="cat-btn${open?' open':''}" onclick="toggleCat('${c.id}')"><span>${c.icon} ${c.name}</span><span class="arr">▶</span></button>`;
    h+=`<div class="cat-kids${open?' show':''}" id="kids_${c.id}">`;
    c.topics.forEach(t=>h+=`<div class="topic-link" onclick="openTopic('${c.id}','${t.id}')">${t.title}</div>`);
    h+=`</div></div>`;
  });
  document.getElementById('sidebarNav').innerHTML=h;
}

function toggleCat(id){
  const el=document.getElementById('kids_'+id),btn=el.previousElementSibling;
  if(el.classList.contains('show')){el.classList.remove('show');btn.classList.remove('open');}
  else{el.classList.add('show');btn.classList.add('open');}
}

function find(cid,tid){const cat=DATA.categories.find(c=>c.id===cid);if(!cat)return[null,null];const t=cat.topics.find(x=>x.id===tid);return[cat,t];}

function showHome(){
  currentCat=null;currentTopic=null;
  let h=`<div class="hero"><div class="emoji">●</div><h2>Icey <em>TEM4</em> Review System</h2><p>覆盖英语专四全部考点：语法、词汇、完形、阅读、写作、听力。<br>每个知识点配有详细讲解、专项练习和历年真题详解。<br>右侧 AI助教随时答疑。</p>`;
  h+=`<div class="hero-grid">`;
  DATA.categories.forEach(c=>{
    h+=`<div class="hero-card" onclick="openCategory('${c.id}')"><span class="hc-icon">${c.icon}</span><div class="hc-title">${c.name}</div><div class="hc-count">${c.topics.length} 个知识点</div></div>`;
  });
  h+=`</div></div>`;
  document.getElementById('mainContent').innerHTML=h;
  highlightSidebar(null,null);
}

function openCategory(cid){
  currentCat=DATA.categories.find(c=>c.id===cid);currentTopic=null;
  if(!currentCat)return;
  let h=`<div class="cat-head"><div class="ch-icon">${currentCat.icon}</div><h2>${currentCat.name}</h2><p>${currentCat.intro}</p></div>`;
  h+=`<div class="topic-grid">`;
  currentCat.topics.forEach(t=>{
    h+=`<div class="t-card" onclick="openTopic('${cid}','${t.id}')"><div class="ttl">${t.title}</div><div class="dsc">${t.desc}</div></div>`;
  });
  h+=`</div>`;
  document.getElementById('mainContent').innerHTML=h;
  highlightSidebar(null,null);buildSidebar();window.scrollTo(0,0);
}

function openTopic(cid,tid){
  const[cat,topic]=find(cid,tid);if(!cat||!topic)return;
  currentCat=cat;currentTopic=topic;quizIdx=0;quizState={};
  topic.practice.forEach((_,i)=>{quizState[i]={sel:null,ok:false,right:false};});
  let h=`<div class="topic-hero"><div class="bread">${cat.icon} ${cat.name} <span>› ${topic.title}</span></div><h2>${topic.title}</h2></div>`;
  h+=`<div class="content-block">${topic.content}</div>`;
  if(topic.practice&&topic.practice.length>0)h+=renderPractice(0);
  if(topic.pastExam&&topic.pastExam.length>0)h+=renderPastExam();
  document.getElementById('mainContent').innerHTML=h;
  highlightSidebar(cid,tid);buildSidebar();closeMobileSidebar();window.scrollTo(0,0);
}

function highlightSidebar(cid,tid){
  document.querySelectorAll('.topic-link').forEach(e=>e.classList.remove('active'));
  if(cid&&tid)document.querySelectorAll('.topic-link').forEach(e=>{if(e.getAttribute('onclick')===`openTopic('${cid}','${tid}')`)e.classList.add('active');});
}

function renderPractice(idx){
  if(!currentTopic)return'';
  const qs=currentTopic.practice,q=qs[idx],st=quizState[idx];
  const done=Object.values(quizState).filter(s=>s.ok).length;
  const correct=Object.values(quizState).filter(s=>s.right).length;
  let h=`<div class="quiz-block" id="quizBlock"><h3>📝 练习题 (${idx+1}/${qs.length})</h3>`;
  h+=`<div class="quiz-progress">已完成 ${done}/${qs.length} 题`;
  if(done>0)h+=` · 正确率 ${Math.round(correct/done*100)}%`;
  h+=`</div><div class="quiz-q"><div class="q-text">${idx+1}. ${q.q}</div><div class="quiz-opts">`;
  q.o.forEach((o,i)=>{
    let cls='quiz-opt';if(st.ok)cls+=' disabled';if(st.ok&&i===q.a)cls+=' correct';else if(st.ok&&i===st.sel&&i!==q.a)cls+=' wrong';else if(!st.ok&&st.sel===i)cls+=' sel';
    h+=`<div class="${cls}" id="opt_${idx}_${i}" onclick="pickAnswer(${idx},${i})">${String.fromCharCode(65+i)}. ${o}</div>`;
  });
  h+=`</div>`;
  if(st.ok)h+=`<div class="quiz-fb show ${st.right?'ok':'bad'}"><strong>${st.right?'✓ 回答正确！':'✗ 回答错误'}</strong><br>${q.e}</div>`;
  h+=`</div></div><div class="quiz-btns"><button class="btn btn-o" onclick="prevQ(${idx})"${idx===0?' disabled':''}>‹ 上一题</button>`;
  if(!st.ok)h+=`<span class="info">点击选项确认</span>`;else h+=`<span class="info">${st.right?'正确 ✓':'错误 ✗'}</span>`;
  if(idx<qs.length-1)h+=`<button class="btn btn-p" onclick="nextQ(${idx})">下一题 ›</button>`;
  else if(st.ok)h+=`<button class="btn btn-p" onclick="showPracticeScore()">查看成绩 ›</button>`;
  h+=`</div>`;return h;
}

function pickAnswer(qi,oi){const st=quizState[qi];if(st.ok)return;st.sel=oi;st.ok=true;st.right=(oi===currentTopic.practice[qi].a);refreshQuiz(qi);}
function prevQ(i){if(i<=0)return;quizIdx=i-1;updateQuizDOM(renderPractice(quizIdx));}
function nextQ(i){if(i>=currentTopic.practice.length-1)return;quizIdx=i+1;updateQuizDOM(renderPractice(quizIdx));}

function showPracticeScore(){
  const qs=currentTopic.practice;
  const c=Object.values(quizState).filter(s=>s.right).length;
  const pct=Math.round(c/qs.length*100);
  let emoji=pct>=80?'●':pct>=60?'◉':'○';
  let h=`<div class="quiz-block"><h3>📝 练习成绩</h3><div class="score-box"><div class="big">${c}/${qs.length}</div><div class="lbl">正确率 ${pct}%</div><div class="emoji">${emoji}</div><p style="margin-top:12px;color:var(--sub);font-size:13px">${pct>=80?'非常棒！这个知识点掌握扎实。':pct>=60?'不错，再看一遍详解会更好！':'继续加油，多看几遍就能攻克！'}</p><button class="btn btn-o" style="margin-top:12px" onclick="retryPractice()">↻ 重新练习</button></div></div>`;
  updateQuizDOM(h);
}

function retryPractice(){
  quizIdx=0;quizState={};currentTopic.practice.forEach((_,i)=>{quizState[i]={sel:null,ok:false,right:false};});
  updateQuizDOM(renderPractice(0));document.getElementById('quizBlock')?.scrollIntoView({behavior:'smooth',block:'center'});
}

function refreshQuiz(i){updateQuizDOM(renderPractice(i));}
function updateQuizDOM(h){
  const t=document.createElement('div');t.innerHTML=h;
  const oldQ=document.getElementById('quizBlock'),oldB=document.querySelector('.quiz-btns');
  const nq=t.querySelector('.quiz-block'),nb=t.querySelector('.quiz-btns');
  if(oldQ&&nq)oldQ.replaceWith(nq);
  if(oldB&&nb)oldB.replaceWith(nb);else if(nb&&document.querySelector('.quiz-block'))document.querySelector('.quiz-block').after(nb);
  if(!nq&&t.firstElementChild){const mb=document.getElementById('mainContent');const lb=mb.querySelector('.quiz-block');if(lb)lb.replaceWith(t.firstElementChild);}
}

// ==================== PAST EXAM ====================
function renderPastExam(){
  if(!currentTopic||!currentTopic.pastExam)return'';
  let h=`<div class="past-exam-block"><h3>◈ 历年真题 · ${currentTopic.pastExam.length} 道</h3>`;
  h+=`<div class="pe-subtitle">收录 2014-2023 年专四真题，点击选项查看对错与详析</div>`;
  currentTopic.pastExam.forEach((pe,pi)=>{
    h+=`<div class="pe-question"><div class="pe-header"><span class="pe-year">${typeof pe.y==="number"?pe.y+" 真题":"华研"}</span></div>`;
    h+=`<div class="pe-qtext">${pi+1}. ${pe.q}</div>`;
    if(pe.o&&pe.o.length>0){
      h+=`<div class="pe-opts">`;
      pe.o.forEach((o,oi)=>{h+=`<div class="pe-opt" id="pe_${pi}_${oi}" onclick="checkPastExam(${pi},${oi})">${String.fromCharCode(65+oi)}. ${o}</div>`;});
      h+=`</div>`;
    }
    h+=`<div class="pe-exp" id="peExp_${pi}"><b>解析：</b>${pe.e}</div>`;
    if(pe.o&&pe.o.length>0)h+=`<span class="pe-toggle" id="peToggle_${pi}" onclick="togglePastExp(${pi})">▶ 查看解析</span>`;
  });
  h+=`</div>`;return h;
}

function checkPastExam(pi,oi){
  const pe=currentTopic.pastExam[pi];if(pe.a<0)return;
  document.querySelectorAll(`.pe-opt[id^="pe_${pi}_"]`).forEach(el=>el.style.pointerEvents='none');
  pe.o.forEach((_,i)=>{
    const el=document.getElementById(`pe_${pi}_${i}`);
    if(i===pe.a)el.classList.add('right');else if(i===oi)el.classList.add('wrong');
  });
  document.getElementById(`peExp_${pi}`).classList.add('show');
  const tg=document.getElementById(`peToggle_${pi}`);if(tg)tg.style.display='none';
}

function togglePastExp(pi){document.getElementById(`peExp_${pi}`).classList.toggle('show');}

// ==================== AI PANEL ====================
let apiKey=localStorage.getItem('tem4_api_key')||'',aiMsgs=[];
function loadApiKey(){const inp=document.getElementById('apiKeyInput');if(inp)inp.value=apiKey;}
function saveApiKey(){
  const inp=document.getElementById('apiKeyInput');apiKey=inp.value.trim();
  localStorage.setItem('tem4_api_key',apiKey);
  if(apiKey)aiMsgs=[];renderAIMessages();
}

function toggleAIPanel(){
  document.getElementById('aiPanel').classList.toggle('open');
  document.getElementById('mainContent').classList.toggle('ai-open');
}

async function sendMsg(){
  const inp=document.getElementById('aiInput'),msg=inp.value.trim();if(!msg)return;
  if(!apiKey){alert('请先在 AI 面板中设置 DeepSeek API Key！');return;}
  inp.value='';aiMsgs.push({role:'user',content:msg});renderAIMessages();
  const msgsDiv=document.getElementById('aiMessages');
  const ld=document.createElement('div');ld.className='ai-msg assistant loading';ld.id='aiLoading';
  ld.innerHTML='<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
  msgsDiv.appendChild(ld);msgsDiv.scrollTop=msgsDiv.scrollHeight;

  let sys='你是 TEM4（英语专四）复习助手。用中文回答，简洁专业。';
  if(currentTopic)sys+=` 学生当前在学习：${currentCat.name} > ${currentTopic.title}。`;
  const messages=[{role:'system',content:sys}];
  aiMsgs.slice(-10).forEach(m=>messages.push({role:m.role,content:m.content}));

  try{
    const resp=await fetch('https://api.deepseek.com/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
      body:JSON.stringify({model:'deepseek-chat',max_tokens:2000,messages})
    });
    const data=await resp.json();
    document.getElementById('aiLoading')?.remove();
    if(data.error)aiMsgs.push({role:'assistant',content:'错误：'+data.error.message});
    else aiMsgs.push({role:'assistant',content:data.choices?.[0]?.message?.content||'（未获得回复）'});
    renderAIMessages();
  }catch(e){
    document.getElementById('aiLoading')?.remove();
    aiMsgs.push({role:'assistant',content:'网络错误：'+e.message+'。请检查 API Key 和网络。'});
    renderAIMessages();
  }
}

function renderAIMessages(){
  const div=document.getElementById('aiMessages');
  let h='';aiMsgs.forEach(m=>h+=`<div class="ai-msg ${m.role}">${m.content.replace(/\n/g,'<br>')}</div>`);
  if(aiMsgs.length===0)h=`<div class="ai-msg assistant">你好！我是 TEM4 复习助手。<br>可以问我任何专四相关问题：<br>· 语法点不理解？<br>· 真题为什么选这个答案？<br>· 作文思路和模板？<br>· 听力和阅读技巧？<br><br>请先设置 DeepSeek API Key。</div>`;
  div.innerHTML=h;div.scrollTop=div.scrollHeight;
}

// ==================== MOBILE ====================
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('mob');document.querySelector('.overlay').classList.toggle('show');}
function closeAll(){document.getElementById('sidebar').classList.remove('mob');document.querySelector('.overlay').classList.remove('show');}
function closeMobileSidebar(){document.getElementById('sidebar').classList.remove('mob');document.querySelector('.overlay').classList.remove('show');}

init();
</script>
</body>
</html>
