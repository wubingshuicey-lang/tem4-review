<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Icey TEM4 Review System</title>
<style>
:root{
  --bg:#f4f1ec;--card:#faf9f7;--text:#1c1a17;--sub:#6b6560;
  --accent:#e04e2f;--accent2:#2b5cb0;--accent-light:#fef0ed;
  --success:#3a7d5a;--danger:#c94a3c;--warn:#d4922c;
  --border:#e6e1d8;--radius:2px;--shadow:2px 2px 0 rgba(0,0,0,.06);
  --sidebar-w:260px;--ai-w:380px;
}
@font-face{font-family:'Editorial';src:local('Georgia'),local('Noto Serif SC'),local('SimSun');}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;position:relative}

/* Noise texture overlay */
body::before{
  content:'';position:fixed;inset:0;z-index:9999;pointer-events:none;opacity:.04;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* Halftone dots - decorative */
.halftone-bg{
  position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.03;
  background-image:radial-gradient(circle,var(--text) 1px,transparent 1px);
  background-size:10px 10px;
}

/* Layout */
.app{display:flex;min-height:100vh;max-width:100vw;overflow-x:hidden;position:relative;z-index:1}

/* Sidebar */
.sidebar{width:var(--sidebar-w);background:var(--card);border-right:2px solid var(--text);position:fixed;top:0;left:0;bottom:0;z-index:100;display:flex;flex-direction:column;transition:transform .3s cubic-bezier(.4,0,.2,1);background-image:radial-gradient(circle,#e8e4de 1px,transparent 1px);background-size:12px 12px;background-position:0 0}
.sidebar-brand{padding:28px 20px;border-bottom:2px solid var(--text);text-align:center;cursor:pointer;position:relative}
.sidebar-brand .logo{font-size:32px;margin-bottom:6px;display:block}
.sidebar-brand h1{font-size:15px;font-weight:800;color:var(--accent);letter-spacing:1px;text-transform:uppercase}
.sidebar-brand .tagline{font-size:9px;color:var(--sub);text-transform:uppercase;letter-spacing:2px;margin-top:3px}
.sidebar-nav{flex:1;overflow-y:auto;padding:8px 0}
.cat-btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 20px;background:none;border:none;font-size:13px;font-weight:700;color:var(--text);cursor:pointer;transition:all .15s;gap:8px;text-transform:uppercase;letter-spacing:.5px}
.cat-btn:hover{background:rgba(0,0,0,.03)}
.cat-btn .arr{font-size:8px;transition:transform .25s;color:var(--sub)}
.cat-btn.open .arr{transform:rotate(90deg)}
.cat-kids{display:none;background:rgba(0,0,0,.015)}
.cat-kids.show{display:block}
.topic-link{display:block;padding:9px 20px 9px 44px;font-size:12px;color:var(--sub);cursor:pointer;border-left:3px solid transparent;transition:all .15s;text-decoration:none}
.topic-link:hover{color:var(--accent);background:var(--accent-light);border-left-color:var(--accent)}
.topic-link.active{color:var(--accent);background:var(--accent-light);border-left-color:var(--accent);font-weight:700}
.sidebar-foot{padding:14px 20px;border-top:2px solid var(--text);font-size:9px;color:var(--sub);text-align:center;text-transform:uppercase;letter-spacing:1px}

/* Main */
.main{flex:1;margin-left:var(--sidebar-w);margin-right:0;padding:28px 32px;max-width:860px;transition:margin .3s;position:relative;z-index:1}
.main.ai-open{margin-right:var(--ai-w)}

/* Mobile */
.mob-bar{display:none;position:fixed;top:0;left:0;right:0;z-index:90;background:var(--card);border-bottom:2px solid var(--text);padding:10px 16px;align-items:center;justify-content:space-between}
.mob-bar .mob-title{font-size:13px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:1px}
.mob-btn{width:36px;height:36px;border-radius:0;border:2px solid var(--text);background:var(--card);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.mob-btn:hover{background:var(--text);color:var(--card)}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:95;backdrop-filter:blur(2px)}

/* Hero */
.hero{text-align:center;padding:64px 20px 44px;position:relative}
.hero::before{
  content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:200px;height:200px;z-index:0;opacity:.06;
  background-image:radial-gradient(circle,var(--accent) 2px,transparent 2px);
  background-size:16px 16px;
}
.hero>*{position:relative;z-index:1}
.hero .emoji{font-size:64px;margin-bottom:12px;display:block}
.hero h2{font-size:32px;font-weight:900;letter-spacing:-1px;margin-bottom:6px;color:var(--text)}
.hero h2 em{font-style:normal;color:var(--accent)}
.hero p{color:var(--sub);font-size:14px;max-width:480px;margin:8px auto 32px;line-height:1.6}
.hero-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;max-width:760px;margin:0 auto}
.hero-card{background:var(--card);border:2px solid var(--text);padding:22px 18px;cursor:pointer;transition:all .2s;text-align:center;position:relative}
.hero-card:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 rgba(0,0,0,.1)}
.hero-card:active{transform:translate(0,0);box-shadow:none}
.hero-card .hc-icon{font-size:30px;margin-bottom:8px;display:block}
.hero-card .hc-title{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.hero-card .hc-count{font-size:10px;color:var(--sub);margin-top:3px}

/* Category head */
.cat-head{background:var(--card);border:2px solid var(--text);padding:28px;margin-bottom:20px;position:relative}
.cat-head .ch-icon{font-size:36px;margin-bottom:8px}
.cat-head h2{font-size:20px;font-weight:800;margin-bottom:6px}
.cat-head p{color:var(--sub);font-size:13px}

.topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:20px}
.t-card{background:var(--card);border:2px solid var(--text);padding:20px;cursor:pointer;transition:all .2s}
.t-card:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 rgba(0,0,0,.1)}
.t-card .ttl{font-weight:800;font-size:14px;margin-bottom:4px}
.t-card .dsc{font-size:11px;color:var(--sub)}

/* Topic page */
.topic-hero{margin-bottom:20px}
.topic-hero .bread{font-size:11px;color:var(--sub);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.topic-hero .bread span{color:var(--accent);font-weight:700}
.topic-hero h2{font-size:24px;font-weight:900}

/* Content blocks */
.content-block{background:var(--card);border:2px solid var(--text);padding:28px;margin-bottom:20px;position:relative}
.content-block::after{content:'';position:absolute;bottom:8px;right:8px;width:40px;height:40px;opacity:.03;background-image:radial-gradient(circle,var(--text) 1.5px,transparent 1.5px);background-size:6px 6px;pointer-events:none}
.content-block h3{font-size:17px;margin-bottom:14px;color:var(--accent);padding-bottom:10px;border-bottom:2px solid var(--text);font-weight:800}
.content-block h4{font-size:14px;margin:18px 0 8px;font-weight:700}
.content-block p{font-size:13.5px;margin-bottom:10px}
.content-block ul,.content-block ol{margin:0 0 14px 20px;font-size:13.5px}
.content-block li{margin-bottom:5px}
.content-block table{width:100%;border-collapse:collapse;margin:10px 0 18px;font-size:12.5px;border:2px solid var(--text)}
.content-block th{background:var(--text);color:var(--card);padding:9px 12px;text-align:left;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.content-block td{padding:9px 12px;border-bottom:1px solid var(--border);border-right:1px solid var(--border)}
.content-block tr:hover td{background:rgba(0,0,0,.02)}

.ex-box{background:var(--card);border-left:4px solid var(--text);padding:12px 16px;margin:10px 0;font-size:13px;position:relative}
.ex-box .en{font-style:italic;margin-bottom:3px;font-family:Editorial,Georgia,serif}
.ex-box .cn{color:var(--sub);font-size:12px}

.highlight{background:rgba(224,78,47,.1);padding:2px 5px;font-weight:600;font-size:12px;color:var(--accent)}
.tip{background:rgba(58,125,90,.06);border:2px solid var(--success);padding:12px 16px;margin:10px 0;font-size:12.5px;display:flex;gap:8px;align-items:flex-start}
.tip .ti{flex-shrink:0;font-size:16px}
.warn{background:rgba(224,78,47,.04);border:2px solid var(--danger);padding:12px 16px;margin:10px 0;font-size:12.5px;display:flex;gap:8px;align-items:flex-start}
.warn .wi{flex-shrink:0;font-size:16px}

/* Quiz */
.quiz-block{background:var(--card);border:2px solid var(--text);padding:24px;margin-bottom:20px;position:relative}
.quiz-block h3{font-size:15px;margin-bottom:4px;font-weight:800}
.quiz-progress{font-size:11px;color:var(--sub);margin-bottom:18px}
.quiz-q{background:rgba(0,0,0,.015);padding:18px;margin-bottom:16px;border:1px solid var(--border)}
.quiz-q .q-text{font-weight:700;font-size:14px;margin-bottom:14px}
.quiz-opts{display:flex;flex-direction:column;gap:8px}
.quiz-opt{padding:11px 14px;border:2px solid var(--border);cursor:pointer;transition:all .15s;font-size:13px;background:var(--card)}
.quiz-opt:hover{border-color:var(--text);transform:translateX(2px)}
.quiz-opt.sel{border-color:var(--text);background:rgba(0,0,0,.04)}
.quiz-opt.correct{border-color:var(--success);background:rgba(58,125,90,.08)}
.quiz-opt.wrong{border-color:var(--danger);background:rgba(224,78,47,.06)}
.quiz-opt.disabled{pointer-events:none}
.quiz-fb{display:none;margin-top:12px;padding:12px 16px;font-size:12.5px;border:2px solid}
.quiz-fb.show{display:block}
.quiz-fb.ok{border-color:var(--success);background:rgba(58,125,90,.06);color:#166534}
.quiz-fb.bad{border-color:var(--danger);background:rgba(224,78,47,.04);color:#991b1b}
.quiz-btns{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.quiz-btns .info{font-size:11px;color:var(--sub)}
.btn{padding:9px 18px;border:2px solid var(--text);cursor:pointer;font-size:12px;font-weight:700;transition:all .15s;text-transform:uppercase;letter-spacing:.5px;background:var(--card)}
.btn:hover{transform:translate(-1px,-1px);box-shadow:2px 2px 0 rgba(0,0,0,.15)}
.btn:active{transform:translate(0,0);box-shadow:none}
.btn-p{background:var(--text);color:var(--card)}
.btn-p:hover{background:var(--accent);border-color:var(--accent)}
.btn-o{background:var(--card);color:var(--text)}
.btn-o:hover{background:var(--text);color:var(--card)}
.btn:disabled{opacity:.3;cursor:not-allowed;transform:none;box-shadow:none}

/* Score */
.score-box{text-align:center;padding:30px}
.score-box .big{font-size:48px;font-weight:900;color:var(--accent)}
.score-box .lbl{font-size:12px;color:var(--sub);margin-top:4px;text-transform:uppercase;letter-spacing:1px}
.score-box .emoji{font-size:40px;margin-top:8px}

/* Past Exam */
.past-exam-block{background:var(--card);border:2px solid var(--text);padding:24px;margin-bottom:20px}
.past-exam-block h3{font-size:15px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.past-exam-block .pe-subtitle{font-size:13px;color:var(--sub);margin-bottom:16px}
.pe-question{padding:16px 0;border-bottom:1px solid var(--border);position:relative}
.pe-question .pe-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.pe-question .pe-year{font-size:11px;background:var(--text);color:var(--card);padding:3px 8px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.pe-question .pe-qtext{font-size:13px;font-weight:600;margin-bottom:12px}
.pe-question .pe-opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.pe-question .pe-opt{padding:8px 12px;border:2px solid var(--border);cursor:pointer;font-size:12px;transition:all .12s;background:var(--card)}
.pe-question .pe-opt:hover{border-color:var(--text);transform:translateX(2px)}
.pe-question .pe-opt.right{border-color:var(--success);background:rgba(58,125,90,.08)}
.pe-question .pe-opt.wrong{border-color:var(--danger);background:rgba(224,78,47,.06)}
.pe-question .pe-exp{display:none;margin-top:10px;padding:10px 14px;background:rgba(212,146,44,.08);border:1px solid var(--warn);font-size:13px;color:#5c3d0e}
.pe-question .pe-exp.show{display:block}
.pe-question .pe-toggle{font-size:11px;color:var(--accent);cursor:pointer;margin-top:6px;display:inline-block;font-weight:700;text-transform:uppercase;letter-spacing:.5px;text-decoration:underline}

/* AI Panel */
.ai-panel{position:fixed;top:0;right:0;bottom:0;width:var(--ai-w);background:var(--card);border-left:2px solid var(--text);z-index:100;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);background-image:radial-gradient(circle,#e8e4de .5px,transparent .5px);background-size:8px 8px}
.ai-panel.open{transform:translateX(0)}
.ai-header{padding:16px 20px;border-bottom:2px solid var(--text);display:flex;align-items:center;justify-content:space-between}
.ai-header h3{font-size:13px;font-weight:800;display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.5px}
.ai-close{background:none;border:2px solid var(--text);font-size:14px;cursor:pointer;color:var(--text);padding:2px 8px;font-weight:700}
.ai-close:hover{background:var(--text);color:var(--card)}
.ai-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.ai-msg{max-width:90%;padding:10px 14px;font-size:12.5px;line-height:1.55;border:2px solid var(--text)}
.ai-msg.user{align-self:flex-end;background:var(--text);color:var(--card)}
.ai-msg.assistant{align-self:flex-start;background:var(--card)}
.ai-msg.loading{display:flex;gap:4px;padding:12px 16px;border-style:dashed}
.ai-msg.loading .dot{width:6px;height:6px;border-radius:50%;background:var(--text);animation:bounce 1.4s infinite ease-in-out both}
.ai-msg.loading .dot:nth-child(1){animation-delay:-.32s}
.ai-msg.loading .dot:nth-child(2){animation-delay:-.16s}
@keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
.ai-input-area{padding:12px 16px;border-top:2px solid var(--text)}
.ai-input-row{display:flex;gap:8px}
.ai-input-row input{flex:1;padding:9px 12px;border:2px solid var(--text);font-size:12px;outline:none;font-family:inherit;background:var(--card)}
.ai-input-row input:focus{border-color:var(--accent)}
.ai-input-row button{padding:9px 14px;background:var(--text);color:var(--card);border:2px solid var(--text);font-size:11px;cursor:pointer;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.ai-input-row button:hover{background:var(--accent);border-color:var(--accent)}
.ai-settings{padding:8px 16px;font-size:9px;color:var(--sub);display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--border)}
.ai-settings input{flex:1;padding:5px 8px;border:2px solid var(--border);font-size:9px;outline:none;background:var(--card)}
.ai-settings input:focus{border-color:var(--text)}

.ai-toggle{position:fixed;right:16px;bottom:24px;z-index:99;width:48px;height:48px;border:2px solid var(--text);background:var(--card);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.ai-toggle:hover{background:var(--text);transform:translate(-2px,-2px);box-shadow:3px 3px 0 rgba(0,0,0,.15)}

/* Writing */
.essay-topic-card{background:var(--card);border:2px solid var(--text);padding:20px;margin-bottom:12px}
.essay-topic-card .et-year{font-size:10px;color:var(--accent);font-weight:800;margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
.essay-topic-card .et-title{font-size:14px;font-weight:700;margin-bottom:10px}
.essay-topic-card .et-outline{font-size:12px;color:var(--sub);line-height:1.6}

/* Scrollbar */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--text);border-radius:0}
.sidebar-nav::-webkit-scrollbar{width:3px}
code{background:rgba(0,0,0,.04);padding:2px 5px;font-size:12px;color:var(--accent);border:1px solid var(--border)}

@media(max-width:900px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.mob{transform:translateX(0)}
  .main{margin-left:0;padding:60px 16px 24px}
  .main.ai-open{margin-right:0}
  .ai-panel{width:100%;max-width:100%}
  .mob-bar{display:flex}
  .overlay.show{display:block}
  .hero-grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .topic-grid{grid-template-columns:1fr}
  .hero{padding:30px 10px 20px}
  .hero h2{font-size:22px}
  .pe-question .pe-opts{grid-template-columns:1fr}
  .hero-card{padding:16px 12px}
}

@media(max-width:480px){
  .hero-grid{grid-template-columns:1fr 1fr}
  .content-block,.quiz-block,.past-exam-block{padding:16px}
}
</style>
</head>
<body>

<div class="halftone-bg"></div>

<div class="app">

<!-- Mobile Bar -->
<div class="mob-bar">
  <button class="mob-btn" onclick="toggleSidebar()">☰</button>
  <span class="mob-title">Icey TEM4</span>
  <button class="mob-btn" onclick="toggleAIPanel()">💬</button>
</div>
<div class="overlay" onclick="closeAll()"></div>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand" onclick="showHome()">
    <div class="logo">●</div>
    <h1>Icey TEM4</h1>
    <div class="tagline">Review System</div>
  </div>
  <nav class="sidebar-nav" id="sidebarNav"></nav>
  <div class="sidebar-foot">ICEY · TEM-4 · MMXXVI</div>
</aside>

<!-- AI Toggle -->
<button class="ai-toggle" onclick="toggleAIPanel()" id="aiToggle">💬</button>

<!-- Main -->
<main class="main" id="mainContent"></main>

<!-- AI Panel -->
<div class="ai-panel" id="aiPanel">
  <div class="ai-header">
    <h3>◉ AI 助教</h3>
    <button class="ai-close" onclick="toggleAIPanel()">✕</button>
  </div>
  <div class="ai-settings">
    <span>API KEY</span>
    <input type="password" id="apiKeyInput" placeholder="sk-...">
    <button onclick="saveApiKey()" style="padding:4px 8px;font-size:9px;border:2px solid var(--text);background:var(--card);cursor:pointer;font-weight:700">保存</button>
  </div>
  <div class="ai-msgs" id="aiMessages">
    <div class="ai-msg assistant">你好！我是 TEM4 复习助手。<br>可以问我任何专四相关问题：<br>· 语法点不理解？<br>· 真题为什么选这个答案？<br>· 作文思路和模板？<br>· 听力和阅读技巧？<br><br>请先设置 DeepSeek API Key。</div>
  </div>
  <div class="ai-input-area">
    <div class="ai-input-row">
      <input id="aiInput" placeholder="问任何 TEM4 问题..." onkeydown="if(event.key==='Enter')sendMsg()">
      <button onclick="sendMsg()">发送</button>
    </div>
  </div>
</div>
</div>

<script>
// ==================== DATA ====================
const DATA={categories:[
{id:'grammar',icon:'◧',name:'语法知识',intro:'英语专四语法核心考点，涵盖时态语态、虚拟语气、非谓语动词、三大从句等15个知识点。每个知识点配有详细讲解、练习题和历年真题。',topics:[
{id:'tense',title:'时态与语态',desc:'16种时态及主动/被动语态转换规则，含近年真题详解',content:`
<h3>英语时态总览</h3>
<p>英语共有 <strong>16种时态</strong>，由"时间"（过去、现在、将来、过去将来）和"状态"（一般、进行、完成、完成进行）组合而成。专四考试重点考查<strong>现在完成时、过去完成时、将来完成时</strong>以及各时态的<strong>被动语态</strong>。</p>

<h4>一、核心时态详解</h4>
<table><tr><th>时态</th><th>构成</th><th>核心用法</th></tr>
<tr><td>一般现在时</td><td>do / does</td><td>经常性动作、客观真理、时刻表</td></tr>
<tr><td>一般过去时</td><td>did</td><td>过去某时发生的动作</td></tr>
<tr><td>一般将来时</td><td>will do</td><td>将来发生的动作</td></tr>
<tr><td>现在完成时</td><td>have / has done</td><td>过去发生、影响持续到现在。标志词：already, yet, since, for, in the past...</td></tr>
<tr><td>过去完成时</td><td>had done</td><td>"过去的过去"。标志词：by the time+过去, before+过去, after+过去完成</td></tr>
<tr><td>将来完成时</td><td>will have done</td><td>将来某时之前已完成的动作。标志词：by+将来时间</td></tr>
<tr><td>现在进行时</td><td>am/is/are doing</td><td>正在进行的动作；与always连用表感情色彩</td></tr>
<tr><td>过去进行时</td><td>was/were doing</td><td>过去某时正在进行的动作</td></tr>
<tr><td>现在完成进行时</td><td>have/has been doing</td><td>从过去持续到现在，可能继续下去</td></tr></table>

<h4>二、专四高频考点</h4>
<p><strong>1. 现在完成时 vs 一般过去时</strong></p>
<p>现在完成时强调<strong>与现在的联系</strong>；一般过去时只陈述过去事实，与现在无关。</p>
<div class="ex-box"><div class="en">I <strong>have lost</strong> my key. (现在还没找到)</div><div class="cn">vs. I <strong>lost</strong> my key yesterday. (只讲昨天的事，现在可能已找到)</div></div>

<p><strong>2. 过去完成时</strong> — 专四最常考！</p>
<p>表示"过去的过去"，常与 by the time, before, when, after 连用。</p>
<div class="ex-box"><div class="en">By the time he arrived, the meeting <strong>had already started</strong>.</div><div class="cn">他到达时，会议已经开始。</div></div>
<div class="ex-box"><div class="en">No sooner <strong>had</strong> I <strong>left</strong> the house than it began to rain.</div><div class="cn">我刚离开房子就下雨了。（倒装+过去完成时）</div></div>

<p><strong>3. 将来完成时</strong></p>
<div class="ex-box"><div class="en">By next June, I <strong>will have graduated</strong> from college.</div><div class="cn">到明年六月，我将已经大学毕业。</div></div>

<h4>三、被动语态</h4>
<p>构成：<code>be + 过去分词</code>。不同时态的被动语态通过 be 动词的变化来体现。</p>
<table><tr><th>时态</th><th>主动</th><th>被动</th></tr>
<tr><td>一般现在时</td><td>He writes it.</td><td>It <strong>is written</strong>.</td></tr>
<tr><td>一般过去时</td><td>He wrote it.</td><td>It <strong>was written</strong>.</td></tr>
<tr><td>现在完成时</td><td>He has written it.</td><td>It <strong>has been written</strong>.</td></tr>
<tr><td>过去完成时</td><td>He had written it.</td><td>It <strong>had been written</strong>.</td></tr>
<tr><td>将来完成时</td><td>He will have written it.</td><td>It <strong>will have been written</strong>.</td></tr>
<tr><td>现在进行时</td><td>He is writing it.</td><td>It <strong>is being written</strong>.</td></tr>
<tr><td>情态动词</td><td>He must write it.</td><td>It <strong>must be written</strong>.</td></tr></table>

<div class="warn"><span class="wi">⚠</span><div>不及物动词和系动词（happen, occur, appear, seem, taste, feel, sound 等）<strong>没有被动语态</strong>。特别注意：take place, belong to, break out 等短语也无被动。</div></div>

<div class="tip"><span class="ti">✦</span><div><strong>解题技巧：</strong>看到 by the time + 过去时间 → 过去完成时；by + 将来时间 → 将来完成时；No sooner / Hardly / Scarcely 句首 + had + 主语 + done。注意时间状语和上下文的参照。</div></div>

<h3>虚拟语气 (Subjunctive Mood)</h3>
<p>虚拟语气表示<strong>假设、愿望、建议</strong>等非真实情况，是专四语法选择题的<strong>必考点</strong>（每年 2-3 题）。</p>

<h4>一、if 条件句中的虚拟</h4>
<table><tr><th>时间</th><th>从句谓语形式</th><th>主句谓语形式</th></tr>
<tr><td>与现在相反</td><td>did / were</td><td>would / could / might / should + do</td></tr>
<tr><td>与过去相反</td><td>had done</td><td>would / could / might / should + have done</td></tr>
<tr><td>与将来相反</td><td>did / were / were to do / should do</td><td>would / could / might / should + do</td></tr></table>
<div class="ex-box"><div class="en">If I <strong>were</strong> you, I <strong>would accept</strong> the offer. (与现在相反)</div></div>
<div class="ex-box"><div class="en">If he <strong>had studied</strong> harder, he <strong>would have passed</strong>. (与过去相反)</div></div>
<div class="ex-box"><div class="en">If it <strong>were to rain</strong> tomorrow, the match <strong>would be postponed</strong>. (与将来相反)</div></div>

<div class="tip"><span class="ti">✦</span><div><strong>混合时间虚拟（错综条件句）：</strong>从句和主句时间不一致时各自按各自时间规则变化。<br>如：If I <strong>had studied</strong> harder (过去), I <strong>would be</strong> a college student now (现在).<br><strong>省略 if 的倒装：</strong>Had I known = If I had known; Were I you = If I were you.</div></div>

<h4>二、名词性从句中的虚拟（专四高频！）</h4>
<p>表示<strong>建议、命令、要求、愿望</strong>等动词后的宾语从句，谓语用 <code>(should) + 动词原形</code>。</p>
<p>常见动词：<span class="highlight">suggest, insist, order, command, demand, require, request, propose, recommend, advise, urge, prefer, move(动议), vote(投票建议)</span></p>
<p>常见形容词：<span class="highlight">necessary, important, essential, vital, imperative, desirable, advisable, strange, natural</span></p>
<div class="ex-box"><div class="en">The doctor suggested that he <strong>(should) give up</strong> smoking.</div></div>
<div class="ex-box"><div class="en">It is essential that every child <strong>(should) have</strong> equal access to education.</div></div>

<div class="warn"><span class="wi">⚠</span><div><strong>注意区分：</strong>suggest 表示"暗示、表明"，insist 表示"坚持认为（事实）"时，<strong>不用虚拟语气</strong>！<br>如：His pale face suggested that he <strong>was</strong> ill. （暗示他生病，用正常时态）<br>He insisted that he <strong>was</strong> innocent. （坚持认为自己无辜，事实陈述）</div></div>

<h4>三、其他重要虚拟句型</h4>
<p><strong>1. wish / if only + 虚拟</strong></p>
<table><tr><th>时间</th><th>谓语形式</th><th>例句</th></tr>
<tr><td>现在愿望（不能实现）</td><td>did / were</td><td>I wish I <strong>were</strong> taller.</td></tr>
<tr><td>过去愿望（已发生）</td><td>had done</td><td>I wish I <strong>had taken</strong> your advice.</td></tr>
<tr><td>将来愿望（不太可能）</td><td>would / could + do</td><td>I wish it <strong>would stop</strong> raining.</td></tr></table>

<p><strong>2. It is (high / about) time that...</strong> 从句用 <code>did / were</code> 或 <code>should do</code>（should不可省略时少见）</p>

<p><strong>3. would rather / would sooner / would just as soon + 从句</strong></p>
<div class="ex-box"><div class="en">I'd rather you <strong>stayed</strong> at home now.（现在/将来 → 过去式）</div></div>
<div class="ex-box"><div class="en">I'd rather you <strong>hadn't told</strong> him the truth.（过去 → had done）</div></div>

<p><strong>4. as if / as though</strong> 从句虚拟</p>
<p><strong>5. lest / for fear that / in case</strong> + (should) do</p>

{id:'nonfinite',title:'非谓语动词',desc:'不定式、动名词、分词三大非谓语形式的用法、区别及解题技巧',content:`
<h3>非谓语动词 (Non-finite Verbs)</h3>
<p>非谓语动词是专四<strong>每年必考 2-4 题</strong>的核心考点。包括三种形式：<strong>不定式 (to do)</strong>、<strong>动名词 (doing)</strong> 和<strong>分词 (doing / done)</strong>。</p>
<p><strong>核心解题思路：</strong>①判断非谓语与逻辑主语的关系——主动/被动？②判断非谓语与谓语动词的时间先后——同时/之前？</p>

<h4>一、不定式 (to do) vs 动名词 (doing) 作宾语</h4>
<table><tr><th>接不定式 to do 的动词</th><th>接动名词 doing 的动词</th></tr>
<tr><td>agree, decide, hope, plan, promise, refuse, want, wish, expect, pretend, manage, afford, offer, attempt, fail</td><td>avoid, consider, delay, deny, enjoy, finish, imagine, mind, miss, practice, risk, suggest, admit, appreciate, postpone, can't help</td></tr></table>

<p><strong>接 to do 和 doing 意义不同的动词（专四高频！）：</strong></p>
<table><tr><th>动词</th><th>+ to do</th><th>+ doing</th></tr>
<tr><td>remember</td><td>记得要做（未做）</td><td>记得做过（已做）</td></tr>
<tr><td>forget</td><td>忘记要做（未做）</td><td>忘记做过（已做）</td></tr>
<tr><td>regret</td><td>遗憾地要做（to tell/to say）</td><td>后悔做过</td></tr>
<tr><td>stop</td><td>停下来去做另一件事</td><td>停止正在做的事</td></tr>
<tr><td>try</td><td>努力做</td><td>尝试做</td></tr>
<tr><td>mean</td><td>打算做</td><td>意味着</td></tr>
<tr><td>go on</td><td>接着做另一件事</td><td>继续做同一件事</td></tr>
<tr><td>can't help</td><td>不能帮忙做</td><td>忍不住做</td></tr></table>

<h4>二、分词作状语（专四最高频考点！）</h4>
<p>分词作状语时，其<strong>逻辑主语必须与主句主语一致</strong>。主动关系→doing；被动关系→done；先于谓语动词发生→having done / having been done。</p>
<div class="ex-box"><div class="en"><strong>Seeing</strong> from the top of the hill, we found the city beautiful.（we 主动 see）</div></div>
<div class="ex-box"><div class="en"><strong>Seen</strong> from the top of the hill, the city looks beautiful.（city 被 see）</div></div>

<div class="warn"><span class="wi">⚠</span><div><strong>垂悬分词 (Dangling Participle) 是专四常见错误选项！</strong>分词逻辑主语必须与主句主语一致。<br>❌ Walking down the street, a car hit him. （车在走路？）<br>✓ Walking down the street, he was hit by a car.</div></div>

<h4>三、非谓语动词的时态和语态总表</h4>
<table><tr><th>形式</th><th>不定式</th><th>动名词</th><th>现在分词</th></tr>
<tr><td>一般式主动</td><td>to do</td><td>doing</td><td>doing</td></tr>
<tr><td>一般式被动</td><td>to be done</td><td>being done</td><td>being done</td></tr>
<tr><td>完成式主动</td><td>to have done</td><td>having done</td><td>having done</td></tr>
<tr><td>完成式被动</td><td>to have been done</td><td>having been done</td><td>having been done</td></tr></table>

<h4>四、独立主格结构</h4>
<p>非谓语动词带有自己的逻辑主语，与主句主语不同，构成独立主格结构。</p>
<div class="ex-box"><div class="en"><strong>Weather permitting</strong>, we will go for a picnic.（weather 主动 permit）</div></div>
<div class="ex-box"><div class="en"><strong>All things considered</strong>, it's a good plan.（all things 被 consider）</div></div>
